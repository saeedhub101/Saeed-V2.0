name: Saeed AI — Phase 1–3 Verification (No Build)

# Manual-only verification. This workflow never packages or builds the Windows application.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify foundation, character rig and intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies only
        id: install
        run: npm ci

      - name: GLB byte normalization regression
        id: glb_bytes
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-glb-bytes.js

      - name: GLB candidate validation regression
        id: glb_candidate
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-glb-candidate-validation.js

      - name: Authoritative GLB rig mapping
        id: glb_rig
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-authoritative-glb-rig.js

      - name: Intelligence security and cancellation
        id: intelligence
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-intelligence-security.js

      - name: JavaScript syntax checks
        id: syntax
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/main/conversation/conversation-agent.js
          node --check src/main/brain/brain.js
          node --check src/main/automation/local-executor.js
          node --check src/main/brain/model-executor.js
          node --check src/main/voice/voice-runtime.js
          node --check src/main/voice/voice-host.js
          node --check src/main/runtime.js
          node --check src/learning/index.js
          node --check src/tools/addons.js
          node --check src/tools/redact.js
          node --check src/addons/credentials.js
          node --check src/performance.js
          node --check src/main/character/glb-validation.js
          node --check src/main/application/brain-host.js
          node --check src/main/character/character-host.js
          node --check src/tools/registry.js

      - name: Animation and authoritative GLB health
        id: animation
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-animation-health.js

      - name: Architecture contract
        id: architecture
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-architecture-contract.js

      - name: Foundation and IPC contract
        id: foundation
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci-foundation-contract.js

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-3-verification-report
          path: animation-health-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if any verification failed
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          GLB_BYTES: ${{ steps.glb_bytes.outcome }}
          GLB_CANDIDATE: ${{ steps.glb_candidate.outcome }}
          GLB_RIG: ${{ steps.glb_rig.outcome }}
          INTELLIGENCE: ${{ steps.intelligence.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          ANIMATION: ${{ steps.animation.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          FOUNDATION: ${{ steps.foundation.outcome }}
        run: |
          failed=0
          for check in INSTALL GLB_BYTES GLB_CANDIDATE GLB_RIG INTELLIGENCE SYNTAX ANIMATION ARCHITECTURE FOUNDATION; do
            value="${!check}"
            echo "$check=$value"
            if [ "$value" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Phase 1–3 verification failed. Inspect each step and the animation-health artifact. No application build was performed."
            exit 1
          fi
          echo "PHASE_1_3_VERIFICATION=PASS (no application build performed)"
