name: Saeed AI — Current Product Preflight (No Build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validate current GLB and runtime preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run current product preflight
        run: npm test
      - name: Upload current preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-product-preflight-${{ github.run_number }}
          path: ci-reports/current-acceptance.json
          if-no-files-found: error
          retention-days: 14
