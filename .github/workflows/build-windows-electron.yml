name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/build-windows-electron.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified build as the official release for VERSION"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR, found: $releaseVersion" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") { throw "package.json version $($pkg.version) does not match VERSION $releaseVersion (expected $releaseVersion.0)" }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion must equal package.json version" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $releaseVersion) { throw "Release tag $env:GITHUB_REF_NAME does not match VERSION v$releaseVersion" }
            Write-Host "Release tag validated: $env:GITHUB_REF_NAME"
          }
          Write-Host "Official product version: v$releaseVersion"
          Write-Host "Workflow build number: $env:GITHUB_RUN_NUMBER"

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/avatar.js","src/character.html","src/character-feelings.js","src/character-animation-controller.js","src/character-interaction.js","src/character-controls.js","src/character-voice.js","src/autonomous/tasks.js","src/autonomous/feelings.js","src/autonomous/context.js","src/autonomous/default-brain.js","src/autonomous/brain-supervisor.js","src/3d-status.html","src/3d-status.js","src/3d-status.css","src/three/GLTFLoader.js","src/three/BufferGeometryUtils.js","src/index.html","src/agent.js","src/brain-levels.js","src/local-brain.js","src/realtime.js","src/tools.js","src/performance.html","src/performance.js","src/performance.css","src/settings.html","src/settings.css","src/settings.js")
          foreach ($path in $required) { if (-not (Test-Path $path -PathType Leaf)) { throw "Required project file is missing: $path" } }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static JavaScript validation
        run: npm test

      - name: Comprehensive source validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $js = @(Get-ChildItem "src" -Recurse -Filter "*.js" -File)
          if ($js.Count -eq 0) { throw "No JavaScript source files found." }
          foreach($file in $js) {
            node --check $file.FullName
            if($LASTEXITCODE -ne 0){ throw "JavaScript syntax validation failed: $($file.FullName)" }
          }
          $html = @(Get-ChildItem "src" -Recurse -Filter "*.html" -File)
          $css = @(Get-ChildItem "src" -Recurse -Filter "*.css" -File)
          Write-Host "Validated JS files: $($js.Count)"
          Write-Host "HTML files present: $($html.Count)"
          Write-Host "CSS files present: $($css.Count)"
          $pkg=Get-Content "package.json" -Raw|ConvertFrom-Json
          foreach($dep in @($pkg.dependencies.PSObject.Properties.Name+$pkg.devDependencies.PSObject.Properties.Name)){if(-not(Test-Path "node_modules\\$dep")){throw "Installed dependency missing: $dep"}}
          npm ls --depth=0

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $source = "assets/saeed.png"
          $icon = "assets/saeed.ico"
          if (!(Test-Path $source)) { throw "Source Saeed PNG is missing: $source" }
          if (!(Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick --yes --no-progress }
          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick failed to generate $icon" }
          if (!(Test-Path $icon)) { throw "Saeed.ico was not generated from Saeed.png." }
          if ((Get-Item $icon).Length -lt 1000) { throw "Windows icon is unexpectedly small." }
          & magick identify $icon
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected." }

      - name: Build bundled Offline Whisper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "build\whisper") { Remove-Item "build\whisper" -Recurse -Force }
          if (Test-Path "build\whisper-src") { Remove-Item "build\whisper-src" -Recurse -Force }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git build\whisper-src
          cmake -S build\whisper-src -B build\whisper-src\build -A x64 -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build build\whisper-src\build --config Release --target whisper-cli
          New-Item -ItemType Directory -Force -Path build\whisper | Out-Null
          $cli = Get-ChildItem "build\whisper-src\build" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe was not built." }
          Copy-Item $cli.FullName "build\whisper\whisper-cli.exe" -Force
          Get-ChildItem "build\whisper-src\build\bin\Release" -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName "build\whisper\$($_.Name)" -Force }
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" -OutFile "build\whisper\ggml-base-q5_1.bin"
          $size = (Get-Item "build\whisper\ggml-base-q5_1.bin").Length
          if ($size -lt 50000000) { throw "Whisper model download is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash "build\whisper\ggml-base-q5_1.bin" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898") { throw "Whisper model SHA256 mismatch: $hash" }
          & "build\whisper\whisper-cli.exe" --help | Out-File "build\whisper\whisper-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Whisper CLI binary failed its startup/help check." }

      - name: Synthetic Offline Whisper speech test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Speech
          $wav = Join-Path $env:RUNNER_TEMP "saeed-whisper-smoke.wav"
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $synth.SetOutputToWaveFile($wav)
          $synth.Speak("Hello Saeed please tell me the time")
          $synth.Dispose()
          $base = Join-Path $env:RUNNER_TEMP "saeed-whisper-smoke"
          & "build\whisper\whisper-cli.exe" -m "build\whisper\ggml-base-q5_1.bin" -f $wav -otxt -of $base
          if ($LASTEXITCODE -ne 0) { throw "Whisper synthetic speech test failed." }
          $out = "$base.txt"
          if (!(Test-Path $out)) { throw "Whisper did not produce transcript output." }
          $text = (Get-Content $out -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($text)) { throw "Whisper returned an empty transcript." }
          Write-Host "WHISPER_SYNTHETIC_STT=PASS"
          Write-Host "TRANSCRIPT=$text"

      - name: Capture build host CPU and RAM baseline
        shell: powershell
        run: |
          $os=Get-CimInstance Win32_OperatingSystem
          $cpu=(Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
          $total=[math]::Round($os.TotalVisibleMemorySize/1MB,1)
          $free=[math]::Round($os.FreePhysicalMemory/1MB,1)
          Write-Host "HOST_CPU_PERCENT=$([math]::Round($cpu,1))"
          Write-Host "HOST_RAM_TOTAL_GB=$total"
          Write-Host "HOST_RAM_FREE_GB=$free"

      - name: Build Windows installer
        run: npm run dist

      - name: Verify packaged runtime assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "dist\\win-unpacked"
          $required = @(
            "Saeed AI.exe",
            "resources\\app.asar",
            "resources\\whisper\\whisper-cli.exe",
            "resources\\whisper\\ggml-base-q5_1.bin"
          )
          foreach($rel in $required){$p=Join-Path $root $rel;if(!(Test-Path $p -PathType Leaf)){throw "Packaged runtime asset missing: $p";}}
          $model=Get-Item (Join-Path $root "resources\\whisper\\ggml-base-q5_1.bin")
          if($model.Length -lt 50000000){throw "Packaged Whisper model is unexpectedly small: $($model.Length) bytes"}
          & (Join-Path $root "resources\\whisper\\whisper-cli.exe") --help | Out-File (Join-Path $env:RUNNER_TEMP "packaged-whisper-help.txt")
          if($LASTEXITCODE -ne 0){throw "Packaged Whisper executable failed startup/help check."}
          Write-Host "PACKAGED_APP_ASAR=PASS"
          Write-Host "PACKAGED_WHISPER_EXE=PASS"
          Write-Host "PACKAGED_WHISPER_MODEL=PASS"

      - name: Isolated 3D static-image baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\\win-unpacked\\Saeed AI.exe"
          if (!(Test-Path $exe)) { throw "Unpacked application EXE is missing: $exe" }
          $baseline = Join-Path $PWD "dist\\ci-3d-baseline.json"
          $env:SAEED_CI_SMOKE="1"
          $env:SAEED_CI_3D_OFF="1"
          $env:SAEED_CI_3D_BASELINE_REPORT=$baseline
          if (Test-Path $baseline) { Remove-Item $baseline -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-smoke" -WorkingDirectory $PWD -PassThru -Wait
          if (!(Test-Path $baseline)) { throw "Static-image 3D baseline did not produce ci-3d-baseline.json (exit $($proc.ExitCode))." }
          Get-Content $baseline -Raw
          Remove-Item Env:SAEED_CI_3D_OFF -ErrorAction SilentlyContinue
          Remove-Item Env:SAEED_CI_3D_BASELINE_REPORT -ErrorAction SilentlyContinue

      - name: Runtime application smoke test and detailed resource report
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\\win-unpacked\\Saeed AI.exe"
          if (!(Test-Path $exe)) { throw "Unpacked application EXE is missing: $exe" }
          $report = Join-Path $PWD "dist\\ci-runtime-report.json"
          $hostReport = Join-Path $PWD "dist\\ci-host-resource-report.json"
          $env:SAEED_CI_SMOKE="1"
          $env:SAEED_CI_REPORT=$report
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-ci-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-ci-smoke.stderr.log"
          if (Test-Path $report) { Remove-Item $report -Force }
          if (Test-Path $hostReport) { Remove-Item $hostReport -Force }

          function Get-DescendantPids([int]$RootPid) {
            $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $seen = New-Object 'System.Collections.Generic.HashSet[int]'
            $queue = New-Object System.Collections.Generic.Queue[int]
            [void]$seen.Add($RootPid); $queue.Enqueue($RootPid)
            while($queue.Count -gt 0) {
              $parent=$queue.Dequeue()
              foreach($p in $all | Where-Object { $_.ParentProcessId -eq $parent }) {
                if($seen.Add([int]$p.ProcessId)) { $queue.Enqueue([int]$p.ProcessId) }
              }
            }
            return @($seen)
          }

          function Get-HostSample([int]$RootPid,[string]$Label) {
            $pids=@(Get-DescendantPids $RootPid)
            $procs=@()
            foreach($pid in $pids) {
              try {
                $p=Get-Process -Id $pid -ErrorAction Stop
                $procs += [pscustomobject]@{
                  pid=$p.Id; name=$p.ProcessName
                  cpuSec=[math]::Round($p.CPU,3)
                  workingSetMB=[math]::Round($p.WorkingSet64/1MB,1)
                  privateMB=[math]::Round($p.PrivateMemorySize64/1MB,1)
                  threads=$p.Threads.Count; handles=$p.HandleCount
                }
              } catch {}
            }
            $os=Get-CimInstance Win32_OperatingSystem
            $cpu=Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average
            $diskBytes=0; $netBytes=0; $gpuPercent=0
            try { $diskBytes=[math]::Round((Get-Counter '\PhysicalDisk(_Total)\Disk Bytes/sec').CounterSamples[0].CookedValue,0) } catch {}
            try {
              $netBytes=[math]::Round((Get-Counter '\Network Interface(*)\Bytes Total/sec').CounterSamples | Measure-Object -Property CookedValue -Sum | Select-Object -ExpandProperty Sum,0)
            } catch {}
            try { $gpuPercent=[math]::Round((Get-Counter '\GPU Engine(*)\Utilization Percentage').CounterSamples | Measure-Object -Property CookedValue -Sum | Select-Object -ExpandProperty Sum,0) } catch {}
            [pscustomobject]@{
              time=(Get-Date).ToUniversalTime().ToString("o"); label=$Label
              hostCpuPercent=[math]::Round($cpu.Average,1)
              totalRamGB=[math]::Round($os.TotalVisibleMemorySize/1MB,1)
              freeRamGB=[math]::Round($os.FreePhysicalMemory/1MB,1)
              availableRamGB=[math]::Round($os.FreePhysicalMemory/1MB,1)
              diskBytesPerSec=$diskBytes; networkBytesPerSec=$netBytes; gpuEnginePercent=$gpuPercent
              saeedProcesses=$procs
              saeedWorkingSetMB=[math]::Round(($procs | Measure-Object workingSetMB -Sum).Sum,1)
              saeedPrivateMB=[math]::Round(($procs | Measure-Object privateMB -Sum).Sum,1)
              saeedThreads=[int](($procs | Measure-Object threads -Sum).Sum)
              saeedHandles=[int](($procs | Measure-Object handles -Sum).Sum)
            }
          }

          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-smoke" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $hostSamples=New-Object System.Collections.Generic.List[object]
          $started=Get-Date
          while(-not $proc.HasExited) {
            $hostSamples.Add((Get-HostSample $proc.Id "runtime"))
            Start-Sleep -Seconds 1
            if(((Get-Date)-$started).TotalSeconds -gt 300) { try{$proc.Kill()}catch{}; throw "Runtime smoke exceeded 300 seconds." }
          }
          $exitCode=$proc.ExitCode
          $hostSamples.Add((Get-HostSample $proc.Id "after-exit"))
          if (Test-Path $stdout) { Get-Content $stdout -Raw }
          if (Test-Path $stderr) { Get-Content $stderr -Raw }

          $top=@()
          try {
            $top=Get-Process | Where-Object {$_.CPU -ne $null} | Sort-Object CPU -Descending | Select-Object -First 20 ProcessName,Id,CPU,WorkingSet64,PrivateMemorySize64,Threads,Handles |
              ForEach-Object {[pscustomobject]@{name=$_.ProcessName;pid=$_.Id;cpuSec=[math]::Round($_.CPU,2);workingSetMB=[math]::Round($_.WorkingSet64/1MB,1);privateMB=[math]::Round($_.PrivateMemorySize64/1MB,1);threads=$_.Threads.Count;handles=$_.Handles}}
          } catch {}

          $hostSummary=[pscustomobject]@{
            startedAt=$started.ToUniversalTime().ToString("o"); finishedAt=(Get-Date).ToUniversalTime().ToString("o")
            sampleCount=$hostSamples.Count
            peakHostCpuPercent=[math]::Round(($hostSamples.hostCpuPercent | Measure-Object -Maximum).Maximum,1)
            peakHostRamUsedGB=[math]::Round((($hostSamples | ForEach-Object {$_.totalRamGB-$_.freeRamGB}) | Measure-Object -Maximum).Maximum,1)
            peakSaeedWorkingSetMB=[math]::Round(($hostSamples.saeedWorkingSetMB | Measure-Object -Maximum).Maximum,1)
            peakSaeedPrivateMB=[math]::Round(($hostSamples.saeedPrivateMB | Measure-Object -Maximum).Maximum,1)
            peakSaeedThreads=[int](($hostSamples.saeedThreads | Measure-Object -Maximum).Maximum)
            peakSaeedHandles=[int](($hostSamples.saeedHandles | Measure-Object -Maximum).Maximum)
            peakGpuEnginePercent=[math]::Round(($hostSamples.gpuEnginePercent | Measure-Object -Maximum).Maximum,1)
            peakDiskBytesPerSec=[math]::Round(($hostSamples.diskBytesPerSec | Measure-Object -Maximum).Maximum,0)
            peakNetworkBytesPerSec=[math]::Round(($hostSamples.networkBytesPerSec | Measure-Object -Maximum).Maximum,0)
          }
          @{summary=$hostSummary;samples=$hostSamples;topProcessesAtEnd=$top}|ConvertTo-Json -Depth 10|Set-Content $hostReport -Encoding UTF8

          if (!(Test-Path $report)) {
            $stdoutText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            $stderrText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
            $fallback = @{pass=$false;error="Runtime smoke process exited without producing its report.";exitCode=$exitCode;stdout=$stdoutText;stderr=$stderrText}
            $fallback | ConvertTo-Json -Depth 8 | Set-Content $report -Encoding UTF8
            throw "Runtime smoke test did not produce ci-runtime-report.json; diagnostic fallback was written."
          }
          Get-Content $report -Raw
          Get-Content $hostReport -Raw
          if ($exitCode -ne 0) { throw "Runtime smoke process exited with code $exitCode" }
          $json=Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.checks.glbFile.pass) { throw "GLB file check failed." }
          if (-not $json.checks.glbRuntime.pass) { throw "GLB runtime display check failed." }
          if (-not $json.checks.brain.pass) { throw "Agent/brain smoke test failed." }
          if (-not $json.checks.localBrain.pass) { throw "Local Brain smoke test failed." }
          if (-not $json.checks.chat.pass) { throw "Chat/Agent smoke test failed." }
          if (-not $json.checks.tts.pass) { throw "TTS API availability smoke test failed." }
          if (-not $json.checks.micOn.pass) { throw "Microphone ON lifecycle test failed." }
          if (-not $json.checks.ttsResponse.pass) { throw "TTS response-path test with Mic ON failed." }
          if (-not $json.checks.ttsMicOff.pass) { throw "TTS/Mic OFF regression test failed." }
          Write-Host "RUNTIME_GLB=PASS"
          Write-Host "RUNTIME_AGENT_BRAIN=PASS"
          Write-Host "RUNTIME_LOCAL_BRAIN=PASS"
          Write-Host "RUNTIME_CHAT=PASS"
          Write-Host "RUNTIME_TTS_API=PASS"
          Write-Host "RUNTIME_MIC_ON=PASS"
          Write-Host "RUNTIME_TTS_MIC_ON=PASS"
          Write-Host "RUNTIME_TTS_MIC_OFF=PASS (current expected behavior)"
          Write-Host "DETAILED_RESOURCE_REPORT=PASS"

      - name: Capture final build host CPU and RAM
        shell: powershell
        run: |
          $os=Get-CimInstance Win32_OperatingSystem
          $cpu=(Get-CimInstance Win32_Processor | Measure-Object -Property LoadPercentage -Average).Average
          $total=[math]::Round($os.TotalVisibleMemorySize/1MB,1)
          $free=[math]::Round($os.FreePhysicalMemory/1MB,1)
          Write-Host "HOST_CPU_PERCENT=$([math]::Round($cpu,1))"
          Write-Host "HOST_RAM_TOTAL_GB=$total"
          Write-Host "HOST_RAM_FREE_GB=$free"

      - name: Generate Windows updater metadata
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()+".0"
          $f=@(Get-ChildItem dist -Filter "*.exe"|Where-Object{$_.Name-notlike"*uninstaller*"})[0]
          if(!$f){throw "Installer missing"}
          $h=(Get-FileHash $f.FullName -Algorithm SHA512).Hash
          $b=[Convert]::ToBase64String([Convert]::FromHexString($h))
          @{version=$v;files=@(@{url=$f.Name;sha512=$b;size=[int64]$f.Length});releaseDate=(Get-Date).ToUniversalTime().ToString("o")}|ConvertTo-Json -Depth 5|Set-Content dist/latest.yml -Encoding UTF8
          Write-Host "UPDATE_METADATA_CHECK=PASS"

      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if (-not (Test-Path "dist" -PathType Container)) { throw "dist directory was not created" }
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer version mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $blockmaps = @(Get-ChildItem "dist" -Filter "*.blockmap" -File)
          if ($blockmaps.Count -lt 1) { throw "Installer blockmap is missing" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Verify detailed CI reports
        shell: powershell
        run: |
          foreach($p in @("dist\\ci-runtime-report.json","dist\\ci-3d-baseline.json","dist\\ci-host-resource-report.json")) {
            if (!(Test-Path $p)) { throw "Required CI report missing: $p" }
            Write-Host "Verified report: $p"
          }
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
            dist/latest.yml
            dist/ci-runtime-report.json
            dist/ci-3d-baseline.json
            dist/ci-host-resource-report.json


      - name: Publish official release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          echo "Release request accepted for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading verified build assets instead of failing."
            gh release upload "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml --clobber
          else
            gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml \
              --title "Saeed AI ${VERSION}" \
              --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
              --target "${{ github.sha }}"
          fi
