name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/build-windows-electron.yml'
      - 'BUILD_RULES.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release for the VERSION in this commit'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR, found: $releaseVersion" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") {
            throw "package.json version $($pkg.version) does not match VERSION $releaseVersion (expected $releaseVersion.0)"
          }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion must equal package.json version" }
          Write-Host "Official product version: v$releaseVersion"
          Write-Host "Workflow build number: $env:GITHUB_RUN_NUMBER"

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/avatar.js","src/character.html","src/3d-status.html","src/3d-status.js","src/3d-status.css","src/three/GLTFLoader.js","src/three/BufferGeometryUtils.js","src/index.html","src/agent.js","src/realtime.js","src/tools.js")
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required project file is missing: $path" }
          }

      - name: Validate pinned direct dependencies
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $expected = @{
            "three" = "0.180.0"
            "ws" = "8.18.3"
            "electron" = "38.8.6"
            "electron-builder" = "26.15.3"
          }
          foreach ($name in $expected.Keys) {
            $actual = if ($pkg.dependencies.$name) { $pkg.dependencies.$name } else { $pkg.devDependencies.$name }
            if ($actual -ne $expected[$name]) { throw "$name is not pinned to $($expected[$name]); found $actual" }
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static JavaScript validation
        run: npm test

      - name: Enforce Always Listening
        shell: pwsh
        run: |
          $agent = Get-Content "src/agent.js" -Raw
          $renderer = Get-Content "src/renderer.js" -Raw
          if ($agent -notmatch "alwaysListening") { throw "Always Listening contract missing from agent.js" }
          if ($renderer -notmatch "alwaysListening") { throw "Always Listening contract missing from renderer.js" }
          if ($agent -notmatch 'micMode:\s*"always"') { throw "Microphone mode is not locked to Always Listening" }

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $source = "assets/saeed.png"
          $icon = "assets/saeed.ico"
          if (!(Test-Path $source)) { throw "Source Saeed PNG is missing: $source" }
          if (!(Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick --yes --no-progress }
          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick failed to generate $icon" }
          if (!(Test-Path $icon)) { throw "Saeed.ico was not generated from Saeed.png." }
          $bytes = (Get-Item $icon).Length
          if ($bytes -lt 1000) { throw "Windows icon is unexpectedly small: $bytes bytes" }
          & magick identify $icon
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected." }
          Write-Host "Native Windows icon generated from Saeed.png: $icon"

      - name: Build bundled Offline Whisper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "build\whisper") { Remove-Item "build\whisper" -Recurse -Force }
          if (Test-Path "build\whisper-src") { Remove-Item "build\whisper-src" -Recurse -Force }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git build\whisper-src
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip" -OutFile "build\SDL2.zip"
          7z x "build\SDL2.zip" -obuild\sdl2 | Out-Null
          $sdl = (Get-ChildItem "build\sdl2" -Directory | Select-Object -First 1).FullName
          cmake -S build\whisper-src -B build\whisper-src\build -A x64 -DBUILD_SHARED_LIBS=ON -DWHISPER_SDL2=ON -DSDL2_DIR="$sdl\cmake" -DGGML_NATIVE=OFF
          cmake --build build\whisper-src\build --config Release --target whisper-stream
          New-Item -ItemType Directory -Force -Path build\whisper | Out-Null
          $stream = Get-ChildItem "build\whisper-src\build" -Recurse -Filter "whisper-stream.exe" | Select-Object -First 1
          if (!$stream) { throw "whisper-stream.exe was not built." }
          Copy-Item $stream.FullName "build\whisper\whisper-stream.exe" -Force
          Get-ChildItem "build\whisper-src\build" -Recurse -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName "build\whisper\$($_.Name)" -Force }
          $sdlDll = Get-ChildItem $sdl -Recurse -Filter "SDL2.dll" | Select-Object -First 1
          if (!$sdlDll) { throw "SDL2.dll was not found." }
          Copy-Item $sdlDll.FullName "build\whisper\SDL2.dll" -Force
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" -OutFile "build\whisper\ggml-base-q5_1.bin"
          $size = (Get-Item "build\whisper\ggml-base-q5_1.bin").Length
          if ($size -lt 50000000) { throw "Whisper model download is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash "build\whisper\ggml-base-q5_1.bin" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "a3733eda680ef76256db5fc5dd9de8629e62c5e7") { throw "Whisper model SHA256 mismatch: $hash" }
          & "build\whisper\whisper-stream.exe" --help | Out-File "build\whisper\whisper-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Whisper stream binary failed its startup/help check." }
          Write-Host "OFFLINE_WHISPER_READY modelBytes=$size sha256=$hash"

      - name: Build Windows installer
        run: npm run build

      - name: Verify bundled Offline Whisper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach($p in @("build\whisper\whisper-stream.exe","build\whisper\SDL2.dll","build\whisper\ggml-base-q5_1.bin")){
            if(!(Test-Path $p -PathType Leaf)){throw "Missing Offline Whisper component: $p"}
          }
          $modelBytes=(Get-Item "build\whisper\ggml-base-q5_1.bin").Length
          if($modelBytes -lt 50000000){throw "Bundled Whisper model is too small."}
          Write-Host "WHISPER_MODEL_BYTES=$modelBytes"
          Write-Host "OFFLINE_WHISPER_ASSETS=PASS"

      - name: Verify Chat taskbar entry and on-demand lifecycle contract
        shell: pwsh
        run: |
          $main = Get-Content "src/main.js" -Raw
          if ($main -notmatch 'setUserTasks') { throw "Windows taskbar Jump List setup is missing." }
          if ($main -notmatch 'arguments:"--chat"') { throw "Chat Me taskbar entry does not launch the --chat command." }
          if ($main -notmatch 'else if\(process\.argv\.includes\("--chat"\)') { throw "Startup does not explicitly open Chat when launched by the Chat Me taskbar command." }
          if ($main -notmatch 'chatWin\.destroy\(\)') { throw "Closing Chat does not destroy the Chat window." }
          if ($main -notmatch 'resizable:true') { throw "Chat window is not configured as resizable." }
          $style = Get-Content "src/style.css" -Raw
          if ($style -notmatch '#panel>header[^\n]*-webkit-app-region:drag') { throw "Chat header is not configured as draggable." }
          if ($style -notmatch '#panel>header button[^\n]*no-drag') { throw "Chat header controls are not excluded from drag." }
          Write-Host "CHAT_TASKBAR_CONTRACT=PASS"

      - name: Launch built program and verify chat screen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "dist\win-unpacked\Saeed AI.exe"
          if (-not (Test-Path $app -PathType Leaf)) { throw "Built application was not found: $app" }

          $debugPort = 9222
          $proc = Start-Process -FilePath $app -ArgumentList "--chat --remote-debugging-port=$debugPort" -PassThru
          try {
            @'
          const http = require("http");
          const WebSocket = require("ws");
          const port = Number(process.argv[2]);
          const expression = String(process.argv[3] || "");
          const needle = String(process.argv[4] || "index.html");
          const getTargets = () => new Promise((resolve,reject) => {
            http.get(`http://127.0.0.1:${port}/json`, res => {
              let data="";
              res.setEncoding("utf8");
              res.on("data", chunk => data += chunk);
              res.on("end", () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
            }).on("error", reject);
          });
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            let target=null;
            for(let i=0;i<30;i++){
              try{
                const targets=await getTargets();
                target=targets.find(x=>x.type==="page"&&x.webSocketDebuggerUrl&&((x.url||"").includes(needle)||(needle==="index.html"&&x.title==="Saeed AI")));
                if(target)break;
              }catch{}
              await sleep(1000);
            }
            if(!target)throw new Error("Saeed did not expose the chat Chromium page.");
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.once("open",resolve);ws.once("error",reject);});
            const value=await new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(new Error("CDP Runtime.evaluate timed out")),30000);
              ws.on("message",raw=>{
                try{
                  const m=JSON.parse(raw.toString());
                  if(m.id!==1)return;
                  clearTimeout(timer);
                  if(m.error)reject(new Error(m.error.message||"CDP error"));
                  else resolve(m.result?.result?.value);
                }catch(e){reject(e);}
              });
              ws.send(JSON.stringify({id:1,method:"Runtime.evaluate",params:{expression,returnByValue:true,awaitPromise:true}}));
            });
            ws.close();
            process.stdout.write(String(value));
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1);});
          '@ | Set-Content -Path (Join-Path $PWD "dist\cdp-smoke.cjs") -Encoding UTF8
            $expression = 'JSON.stringify({title:document.title,panel:!!document.querySelector("#panel"),panelVisible:document.querySelector("#panel")?.classList.contains("visible"),welcome:document.body?.innerText?.includes("مرحبًا"),closeButton:!!document.querySelector("#closeChat")})'
            $json = & node (Join-Path $PWD "dist\cdp-smoke.cjs") $debugPort $expression
            if ($LASTEXITCODE -ne 0) { throw "CDP chat smoke failed." }
            $value = $json | ConvertFrom-Json
            Write-Host "Runtime page title: $($value.title)"
            Write-Host "Chat panel found: $($value.panel)"
            Write-Host "Chat panel visible: $($value.panelVisible)"
            Write-Host "Chat welcome rendered: $($value.welcome)"
            Write-Host "Chat close button found: $($value.closeButton)"
            if ($value.title -ne "Saeed AI") { throw "Unexpected application page title: $($value.title)" }
            if (-not $value.panel) { throw "Chat panel was not found in the running application." }
            if (-not $value.panelVisible) { throw "Chat panel exists but is not visible." }
            if (-not $value.welcome) { throw "Chat welcome message was not rendered." }
            if (-not $value.closeButton) { throw "Chat close button was not rendered." }
            Write-Host "CHAT_SMOKE=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$PWD\dist\win-unpacked\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify 3D renderer, diagnostic object, and 3D status
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "dist\\win-unpacked\\Saeed AI.exe"
          $debugPort = 9227
          $proc = Start-Process -FilePath $app -ArgumentList "--remote-debugging-port=$debugPort" -PassThru
          try {
            Start-Sleep -Seconds 6
            $expression = 'JSON.stringify({title:document.title,frame:!!document.querySelector("#characterFrame"),canvas:!!document.querySelector("#avatar"),avatarApi:!!window.saeedAvatar,status:window.saeedAvatar?.get3DStatus?.(),bootstrap:window.saeed3DBootstrap})'
            $json = & node (Join-Path $PWD "dist\\cdp-smoke.cjs") $debugPort $expression "character.html"
            if ($LASTEXITCODE -ne 0) { throw "CDP 3D smoke failed." }
            $value = $json | ConvertFrom-Json
            Write-Host "3D page title: $($value.title)"
            Write-Host "3D frame found: $($value.frame)"
            Write-Host "3D canvas found: $($value.canvas)"
            Write-Host "3D avatar API found: $($value.avatarApi)"
            Write-Host ($value.status | ConvertTo-Json -Depth 8 -Compress)
            if ($value.title -ne "Saeed 3D Character") { throw "Unexpected 3D page title: $($value.title)" }
            if (-not $value.frame -or -not $value.canvas -or -not $value.avatarApi) { throw "3D character surface is incomplete." }
            if ($value.status.overall.state -ne "ready") { throw "3D renderer overall state is not READY: $($value.status.overall.state)" }
            if ($value.status.components.threeJs.state -ne "ready") { throw "Three.js status is not READY." }
            if ($value.status.components.webgl.state -ne "ready") { throw "WebGL status is not READY." }
            if ($value.status.components.renderer.state -ne "ready") { throw "WebGLRenderer status is not READY." }
            if ($value.status.components.gltfLoader.state -ne "ready") { throw "GLTFLoader status is not READY." }
            if ($value.status.components.testObject.state -ne "rendered") { throw "Diagnostic 3D object was not rendered." }
            if ([int]$value.status.components.renderLoop.frames -lt 10) { throw "3D render loop did not produce enough frames." }
            if ([int]$value.status.metrics.drawCalls -lt 1) { throw "No WebGL draw calls were recorded." }
            Write-Host "3D_RENDER_SMOKE=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$PWD\\dist\\win-unpacked\\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify chat response, local time, and speech
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "dist\win-unpacked\Saeed AI.exe"
          $debugPort = 9224
          $proc = Start-Process -FilePath $app -ArgumentList "--chat --remote-debugging-port=$debugPort" -PassThru
          try {
            Start-Sleep -Seconds 5
            @'
          const http = require("http");
          const WebSocket = require("ws");
          const port = Number(process.argv[2]);
          const expression = String(process.argv[3] || "");
          const getTargets = () => new Promise((resolve,reject) => {
            http.get(`http://127.0.0.1:${port}/json`, res => {
              let data="";
              res.setEncoding("utf8");
              res.on("data", chunk => data += chunk);
              res.on("end", () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
            }).on("error", reject);
          });
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            let target=null;
            for(let i=0;i<30;i++){
              try{
                const targets=await getTargets();
                target=targets.find(x=>x.type==="page"&&x.webSocketDebuggerUrl&&(((x.url||"").includes("index.html"))||x.title==="Saeed AI"));
                if(target)break;
              }catch{}
              await sleep(1000);
            }
            if(!target)throw new Error("Saeed did not expose the chat Chromium page.");
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.once("open",resolve);ws.once("error",reject);});
            const value=await new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(new Error("CDP Runtime.evaluate timed out")),30000);
              ws.on("message",raw=>{
                try{
                  const m=JSON.parse(raw.toString());
                  if(m.id!==1)return;
                  clearTimeout(timer);
                  if(m.error)reject(new Error(m.error.message||"CDP error"));
                  else resolve(m.result?.result?.value);
                }catch(e){reject(e);}
              });
              ws.send(JSON.stringify({id:1,method:"Runtime.evaluate",params:{expression,returnByValue:true,awaitPromise:true}}));
            });
            ws.close();
            process.stdout.write(String(value));
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1);});
          '@ | Set-Content -Path (Join-Path $PWD "dist\cdp-chat-test.cjs") -Encoding UTF8
            $js = '(async()=>{const input=document.querySelector("#input");const send=document.querySelector("#send");if(!input||!send)throw new Error("Chat controls missing");let speechCalls=0;const fakeSpeech={cancel(){},speak(u){speechCalls++;u.onstart?.();u.onend?.()}};Object.defineProperty(window,"speechSynthesis",{value:fakeSpeech,configurable:true});input.value="What time is it?";send.click();for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,250));}const texts=[...document.querySelectorAll("#messages .assistant")].map(x=>x.innerText);const answer=texts[texts.length-1]||"";return JSON.stringify({answer,speechCalls,apiPrompt:/API key|Open settings/i.test(answer),hasTime:/\b\d{1,2}:\d{2}\b/.test(answer)});})()'
            $json = & node (Join-Path $PWD "dist\cdp-chat-test.cjs") $debugPort $js
            if ($LASTEXITCODE -ne 0) { throw "CDP chat response test failed." }
            $value = $json | ConvertFrom-Json
            Write-Host ($value | ConvertTo-Json -Compress)
            if ($value.apiPrompt) { throw "Chat asked for API configuration instead of returning a time response." }
            if (-not $value.hasTime) { throw "Chat response did not contain a local time." }
            if ([int]$value.speechCalls -lt 1) { throw "Local speech synthesis was not invoked." }
            Write-Host "CHAT_RESPONSE_SMOKE=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$PWD\dist\win-unpacked\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Measure CPU usage of built program
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appPath = (Resolve-Path "dist\\win-unpacked\\Saeed AI.exe").Path
          $appDir = Split-Path $appPath
          $debugPort = 9223
          $stdoutLog = Join-Path $PWD "dist\\cpu-test.stdout.log"
          $stderrLog = Join-Path $PWD "dist\\cpu-test.stderr.log"
          $report = Join-Path $PWD "dist\\cpu-report.json"
          $proc = Start-Process -FilePath $appPath -ArgumentList "--remote-debugging-port=$debugPort" -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

          try {
            Start-Sleep -Seconds 8
            $logicalProcessors = [Environment]::ProcessorCount

            function Get-SaeedCpuSample {
              $processes = @(Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($appDir,[StringComparison]::OrdinalIgnoreCase)
              })
              $ids = @($processes.ProcessId)
              if ($ids.Count -eq 0) { return $null }

              $idSet = @{}
              foreach ($id in $ids) { $idSet[[uint32]$id] = $true }
              $perf = @(Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -ErrorAction SilentlyContinue |
                Where-Object { $idSet.ContainsKey([uint32]$_.IDProcess) })
              if ($perf.Count -eq 0) { return $null }

              $sum = ($perf | Measure-Object -Property PercentProcessorTime -Sum).Sum
              [pscustomobject]@{
                cpu = [double]$sum / $logicalProcessors
                processCount = $ids.Count
              }
            }

            $idleSamples = @()
            $allSamples = @()
            $processCounts = @()

            # Short idle measurement: Saeed is running normally without user interaction.
            for ($i = 0; $i -lt 5; $i++) {
              $sample = Get-SaeedCpuSample
              if ($sample) {
                $idleSamples += $sample.cpu
                $processCounts += $sample.processCount
                $allSamples += $sample.cpu
              }
              Start-Sleep -Seconds 1
            }

            # Short overall measurement: continue sampling while the built program is running normally.
            for ($i = 0; $i -lt 5; $i++) {
              $sample = Get-SaeedCpuSample
              if ($sample) {
                $allSamples += $sample.cpu
                $processCounts += $sample.processCount
              }
              Start-Sleep -Seconds 1
            }

            if (-not $idleSamples.Count -or -not $allSamples.Count) {
              throw "CPU performance samples for the built Saeed program were not available."
            }

            $idleAverage = ($idleSamples | Measure-Object -Average).Average
            $idleMaximum = ($idleSamples | Measure-Object -Maximum).Maximum
            $overallAverage = ($allSamples | Measure-Object -Average).Average
            $overallMaximum = ($allSamples | Measure-Object -Maximum).Maximum

            $result = [ordered]@{
              test = "built-program-cpu"
              logicalProcessors = $logicalProcessors
              saeedProcessesMin = ($processCounts | Measure-Object -Minimum).Minimum
              saeedProcessesMax = ($processCounts | Measure-Object -Maximum).Maximum
              idleSamples = $idleSamples.Count
              overallSamples = $allSamples.Count
              idleCpuAveragePercent = [Math]::Round($idleAverage,2)
              idleCpuMaximumPercent = [Math]::Round($idleMaximum,2)
              overallCpuAveragePercent = [Math]::Round($overallAverage,2)
              overallCpuMaximumPercent = [Math]::Round($overallMaximum,2)
              note = "CPU is normalized across logical processors. Idle = normal operation without user interaction; overall = combined short measurement window."
              measuredAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            }

            $result | ConvertTo-Json | Set-Content $report
            Write-Host "CPU RESOURCE TEST"
            Write-Host "Logical CPUs: $logicalProcessors"
            Write-Host "Saeed Processes: $($result.saeedProcessesMax)"
            Write-Host ""
            Write-Host ("Idle CPU Average: " + $result.idleCpuAveragePercent + "%")
            Write-Host ("Idle CPU Maximum: " + $result.idleCpuMaximumPercent + "%")
            Write-Host ""
            Write-Host ("Overall CPU Average: " + $result.overallCpuAveragePercent + "%")
            Write-Host ("Overall CPU Maximum: " + $result.overallCpuMaximumPercent + "%")
            Write-Host ""
            Write-Host "CPU_CHECK=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$appDir\\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Measure CPU usage with process-tree timing (new independent test)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appPath = (Resolve-Path "dist\\win-unpacked\\Saeed AI.exe").Path
          $appDir = Split-Path $appPath
          $debugPort = 9233
          $stdoutLog = Join-Path $PWD "dist\\cpu-tree-test.stdout.log"
          $stderrLog = Join-Path $PWD "dist\\cpu-tree-test.stderr.log"
          $report = Join-Path $PWD "dist\\cpu-tree-report.json"
          $proc = Start-Process -FilePath $appPath -ArgumentList "--remote-debugging-port=$debugPort" -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

          function Get-ProcessTree([int]$rootPid) {
            $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $known = @{$rootPid = $true}
            do {
              $changed = $false
              foreach ($p in $all) {
                $processId = [int]$p.ProcessId
                $parentProcessId = [int]$p.ParentProcessId
                if (-not $known.ContainsKey($processId) -and $known.ContainsKey($parentProcessId)) {
                  $known[$processId] = $true
                  $changed = $true
                }
              }
            } while ($changed)
            return @($known.Keys | ForEach-Object {[int]$_})
          }

          function Get-TreeCpuSnapshot([int[]]$ids) {
            $now = Get-Date
            $rows = @()
            foreach ($id in $ids) {
              try {
                $p = Get-Process -Id $id -ErrorAction Stop
                $rows += [pscustomobject]@{
                  pid = $id
                  name = $p.ProcessName
                  cpuTimeSeconds = [double]$p.TotalProcessorTime.TotalSeconds
                }
              } catch {}
            }
            [pscustomobject]@{timestamp=$now;rows=$rows}
          }

          try {
            Start-Sleep -Seconds 8
            $ids = @(Get-ProcessTree $proc.Id)
            if (-not $ids.Count) { throw "No Saeed process tree was found." }

            $s1 = Get-TreeCpuSnapshot $ids
            Start-Sleep -Seconds 2
            $ids2 = @(Get-ProcessTree $proc.Id)
            $s2 = Get-TreeCpuSnapshot $ids2

            $wallSeconds = ($s2.timestamp - $s1.timestamp).TotalSeconds
            if ($wallSeconds -le 0) { throw "CPU timing interval was invalid." }

            $first = @{}
            foreach ($row in $s1.rows) { $first[$row.pid] = $row }
            $logicalProcessors = [Environment]::ProcessorCount
            $details = @()
            foreach ($row in $s2.rows) {
              if ($first.ContainsKey($row.pid)) {
                $delta = [Math]::Max(0, $row.cpuTimeSeconds - $first[$row.pid].cpuTimeSeconds)
                $pct = ($delta / $wallSeconds) * 100 / $logicalProcessors
                $details += [pscustomobject]@{pid=$row.pid;name=$row.name;cpuPercent=[Math]::Round($pct,2);cpuTimeDeltaSeconds=[Math]::Round($delta,4)}
              }
            }

            if (-not $details.Count) { throw "No stable Saeed processes were available for CPU timing." }

            $total = ($details | Measure-Object -Property cpuPercent -Sum).Sum
            $max = ($details | Measure-Object -Property cpuPercent -Maximum).Maximum
            $result = [ordered]@{
              test = "built-program-cpu-process-tree-delta"
              logicalProcessors = $logicalProcessors
              rootPid = $proc.Id
              processCount = $details.Count
              totalCpuPercent = [Math]::Round([double]$total,2)
              maxProcessCpuPercent = [Math]::Round([double]$max,2)
              intervalSeconds = [Math]::Round($wallSeconds,3)
              processes = $details
              measuredAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            }
            $result | ConvertTo-Json -Depth 8 | Set-Content $report -Encoding UTF8

            Write-Host "CPU PROCESS-TREE TIMING TEST"
            Write-Host "Root PID: $($result.rootPid)"
            Write-Host "Saeed processes measured: $($result.processCount)"
            foreach ($row in $details | Sort-Object cpuPercent -Descending) {
              Write-Host ("PID {0} {1}: {2}%" -f $row.pid,$row.name,$row.cpuPercent)
            }
            Write-Host ("Total Saeed CPU: " + $result.totalCpuPercent + "%")
            Write-Host ("Maximum single-process CPU: " + $result.maxProcessCpuPercent + "%")
            Write-Host "CPU_PROCESS_TREE_CHECK=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($appDir,[StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Measure RAM usage of built program
        shell: pwsh
        run: |
          $app=(Resolve-Path "dist\win-unpacked\Saeed AI.exe").Path;$dir=Split-Path $app;$p=Start-Process $app -ArgumentList "--remote-debugging-port=9225" -PassThru
          try{Start-Sleep 8;$s=@();1..10|%{ $ps=@(Get-Process|?{$_.Path-and$_.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase)});if($ps.Count){$s+=(($ps|Measure-Object WorkingSet64 -Sum).Sum)};Start-Sleep 1 };if(!$s.Count){throw "RAM samples unavailable"};$a=($s|Measure-Object -Average).Average;Write-Host ("Average RAM MB: "+[math]::Round($a/1MB,2));Write-Host "RAM_CHECK=PASS"}finally{if($p-and-not$p.HasExited){Stop-Process $p.Id -Force -ErrorAction SilentlyContinue};Get-Process | Where-Object { $_.Path -like "$dir\*" } | Stop-Process -Force -ErrorAction SilentlyContinue}
      - name: Measure GPU usage of built program
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app=(Resolve-Path "dist\win-unpacked\Saeed AI.exe").Path
          $dir=Split-Path $app
          $p=Start-Process $app -ArgumentList "--remote-debugging-port=9226" -PassThru
          try {
            Start-Sleep -Seconds 8
            $ids=@(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase) } | Select-Object -ExpandProperty Id)
            $samples=@()
            $counterAvailable=$true
            try { $null=Get-Counter -ListSet "GPU Engine" -ErrorAction Stop } catch { $counterAvailable=$false }
            if($counterAvailable){
              1..10 | ForEach-Object {
                $c=Get-Counter "\GPU Engine(*)\Utilization Percentage" -ErrorAction SilentlyContinue
                $sum=0
                foreach($x in @($c.CounterSamples)){
                  if($x.InstanceName -match "pid_(\d+)_"){
                    $id=[int]$Matches[1]
                    if($ids -contains $id){$sum += [double]$x.CookedValue}
                  }
                }
                $samples += $sum
                Start-Sleep -Seconds 1
              }
            }
            if($samples.Count -gt 0){
              $avg=($samples | Measure-Object -Average).Average
              Write-Host ("Average GPU utilization: "+[math]::Round($avg,2)+"%")
              Write-Host "GPU_CHECK=PASS"
            } else {
              Write-Host "GPU counter unavailable on this Windows runner; no GPU value was invented."
              Write-Host "GPU_CHECK=SKIPPED_NO_GPU_COUNTER"
            }
          } finally {
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Get-Process | Where-Object { $_.Path -like "$dir\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Generate Windows updater metadata
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()+".0";$f=@(Get-ChildItem dist -Filter "*.exe"|?{$_.Name-notlike"*uninstaller*"})[0];if(!$f){throw "Installer missing"};$h=(Get-FileHash $f.FullName -Algorithm SHA512).Hash;$b=[Convert]::ToBase64String([Convert]::FromHexString($h));@{version=$v;files=@(@{url=$f.Name;sha512=$b;size=[int64]$f.Length});releaseDate=(Get-Date).ToUniversalTime().ToString("o")}|ConvertTo-Json -Depth 5|Set-Content dist/latest.yml -Encoding UTF8;Write-Host "UPDATE_METADATA_CHECK=PASS"

      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if (-not (Test-Path "dist" -PathType Container)) { throw "dist directory was not created" }
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer version mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $blockmaps = @(Get-ChildItem "dist" -Filter "*.blockmap" -File)
          if ($blockmaps.Count -lt 1) { throw "Installer blockmap is missing" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Verify graceful shutdown leaves no Saeed processes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = (Resolve-Path "dist\\win-unpacked\\Saeed AI.exe").Path
          $dir = Split-Path $app
          $proc = Start-Process -FilePath $app -ArgumentList "--remote-debugging-port=9234" -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($proc.HasExited) { throw "Saeed exited before the shutdown test." }
            $windows = @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase) })
            if (-not $windows.Count) { throw "No Saeed processes were found before shutdown." }
            $handles = @($windows | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -ExpandProperty MainWindowHandle)
            if (-not $handles.Count) { throw "No Saeed native window handle was found for graceful-close testing." }
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SaeedWindowCloser {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool PostMessage(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam);
          }
          '@
            foreach ($h in $handles) {
              [void][SaeedWindowCloser]::PostMessage([IntPtr]$h,0x0010,[IntPtr]0,[IntPtr]0)
            }
            $deadline=(Get-Date).AddSeconds(15)
            do {
              $left=@(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase) })
              if(-not $left.Count){break}
              Start-Sleep -Milliseconds 500
            } while((Get-Date)-lt $deadline)
            if($left.Count){throw "Saeed processes remained after graceful window close: "+(($left|Select-Object -ExpandProperty Id)-join ",")}
            Write-Host "GRACEFUL_SHUTDOWN_CHECK=PASS"
          }
          finally {
            if($proc -and -not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
            Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installer uninstall removes selected install directory and all Saeed AppData
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })[0]
          if(-not $installer){throw "Installer EXE was not found for uninstall test."}
          $installDir = Join-Path $env:RUNNER_TEMP "saeed-custom-install"
          if(Test-Path $installDir){Remove-Item $installDir -Recurse -Force}
          $appDataPaths=@(
            (Join-Path $env:APPDATA "Saeed AI"),
            (Join-Path $env:LOCALAPPDATA "Saeed AI"),
            (Join-Path $env:LOCALAPPDATA "Saeed AI-updater"),
            (Join-Path $env:APPDATA "Saeed AI-updater")
          )
          foreach($p in $appDataPaths){
            New-Item -ItemType Directory -Path $p -Force | Out-Null
            Set-Content -Path (Join-Path $p "uninstall-test-marker.txt") -Value "Saeed uninstall test" -Encoding UTF8
          }
          Start-Process -FilePath $installer.FullName -ArgumentList @("/S",("/D="+$installDir)) -Wait -NoNewWindow
          $uninstaller=Join-Path $installDir "Uninstall Saeed AI.exe"
          if(-not (Test-Path $uninstaller)){throw "Uninstaller was not created in the selected installation directory: $installDir"}
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($installDir,[StringComparison]::OrdinalIgnoreCase) } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $uninstaller -ArgumentList @("/S") -Wait -NoNewWindow
          if(Test-Path $installDir){throw "Selected installation directory was not completely removed: $installDir"}
          foreach($p in $appDataPaths){if(Test-Path $p){throw "Saeed AppData remained after uninstall: $p"}}
          Write-Host "UNINSTALL_CLEANUP_CHECK=PASS"

      - name: Upload verified build and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
            dist/cpu-test.stdout.log
            dist/cpu-test.stderr.log
            dist/cpu-report.json
            dist/cpu-tree-test.stdout.log
            dist/cpu-tree-test.stderr.log
            dist/cpu-tree-report.json
            dist/latest.yml

      - name: Publish official release only when explicitly requested
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to create a duplicate."
            exit 1
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml \
            --title "Saeed AI ${VERSION}" \
            --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
            --target "${{ github.sha }}"
