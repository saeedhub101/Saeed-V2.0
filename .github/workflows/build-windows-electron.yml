name: Saeed AI — Current Product Acceptance and Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified installer as the official release for VERSION"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build and release packaging
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run current product preflight
        run: npm test

      - name: Generate npm third-party license notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/generate-third-party-notices.js
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "THIRD_PARTY_NOTICES.txt")) { throw "Third-party notice report generation failed." }
          Get-Content "THIRD_PARTY_NOTICES.txt" -TotalCount 8

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "assets/saeed.png"
          $icon = "assets/saeed.ico"
          $iconDir = "dist/icons"
          if (!(Test-Path $source)) { throw "Source PNG is missing: $source" }
          if (!(Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick --yes --no-progress }
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $icon)) { throw "Could not create Windows icon." }
          if ((Get-Item $icon).Length -lt 1000) { throw "Windows icon is unexpectedly small." }
          & magick identify $icon
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected." }
          $sizes = @(256,128,64,48,32,16)
          for ($i=0; $i -lt $sizes.Count; $i++) {
            $out = Join-Path $iconDir ("saeed-" + $sizes[$i] + ".png")
            & magick "${icon}[$i]" -background none -alpha on $out
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $out)) { throw "Failed to extract icon frame $($sizes[$i])." }
          }
          Copy-Item $icon (Join-Path $iconDir "saeed.ico") -Force

      - name: Pre-package Electron startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-prebuild.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-prebuild.stderr.log"
          $env:SAEED_CI_SMOKE = "1"
          $proc = Start-Process -FilePath "node" -ArgumentList "node_modules/electron/cli.js", ".", "--exit" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(120)
          while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!$proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null; throw "Electron startup smoke test timed out." }
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          if ($proc.ExitCode -ne 0) { throw "Electron startup failed with exit code $($proc.ExitCode). $outText $errText" }
          Write-Host "ELECTRON_STARTUP_SMOKE=PASS"
          Write-Host $outText
          if ($errText) { Write-Host $errText }

      - name: Build embedded Whisper runtime
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"
          $root = "build\whisper-runtime"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (Test-Path "build\whisper-src") { Remove-Item "build\whisper-src" -Recurse -Force }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git build\whisper-src
          if ($LASTEXITCODE -ne 0) { throw "Could not clone whisper.cpp." }
          if (!(Test-Path "build\\whisper-src\\LICENSE")) { throw "whisper.cpp license file is missing." }
          Copy-Item "build\\whisper-src\\LICENSE" (Join-Path $root "WHISPER-CPP-LICENSE.txt") -Force
          cmake -S build\whisper-src -B build\whisper-src\build -A x64 -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          if ($LASTEXITCODE -ne 0) { throw "Whisper CMake configure failed." }
          cmake --build build\whisper-src\build --config Release --target whisper-cli
          if ($LASTEXITCODE -ne 0) { throw "Whisper CLI build failed." }
          $cli = Get-ChildItem "build\whisper-src\build" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe was not built." }
          Copy-Item $cli.FullName (Join-Path $root "whisper-cli.exe") -Force
          Get-ChildItem (Split-Path $cli.FullName -Parent) -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $root -Force }
           $model = Join-Path $root "ggml-base-q5_1.bin"
           & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 --output $model "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin"
           if ($LASTEXITCODE -ne 0 -or !(Test-Path $model)) { throw "Whisper model download failed or timed out." }
          $hash = (Get-FileHash (Join-Path $root "ggml-base-q5_1.bin") -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898") { throw "Whisper model SHA256 mismatch: $hash" }
          & (Join-Path $root "whisper-cli.exe") --help | Out-File (Join-Path $root "whisper-help.txt")
          if ($LASTEXITCODE -ne 0) { throw "Embedded Whisper CLI startup check failed." }
          Remove-Item "build\whisper-src" -Recurse -Force
          Write-Host "EMBEDDED_WHISPER=PASS"

      - name: Build Windows installer and unpacked runtime
        run: npm run dist

      - name: character ebgine, rig builder
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\\win-unpacked\\Saeed AI.exe"
          if (!(Test-Path $exe)) { throw "Character Engine/Rig Builder test cannot start: packaged EXE is missing." }
          node scripts/create-ci-static-humanoid-glb.js dist/ci-static-humanoid.glb
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "dist/ci-static-humanoid.glb")) { throw "Could not generate the static humanoid GLB fixture." }
          $userData = Join-Path $env:RUNNER_TEMP "saeed-character-rig-user-data"
          $state = Join-Path $env:RUNNER_TEMP "saeed-character-rig-restart-state.json"
          $env:SAEED_CI_SMOKE = "1"
          $env:SAEED_CI_USER_DATA = $userData
          $env:SAEED_CI_RIG_FIXTURE = (Resolve-Path "dist/ci-static-humanoid.glb").Path
          $env:SAEED_CI_RIG_STATE = $state
          $env:SAEED_CI_RIG_REPORT = (Join-Path $PWD "dist/ci-character-rig-builder-save.json")
          $env:SAEED_CI_RIG_SCREENSHOT_BEFORE = (Join-Path $PWD "dist/ci-character-rig-builder-before.png")
          $env:SAEED_CI_RIG_SCREENSHOT_SAEED_BEFORE = (Join-Path $PWD "dist/ci-character-rig-builder-saeed-before.png")
          $env:SAEED_CI_RIG_SCREENSHOT_SAEED_AFTER = (Join-Path $PWD "dist/ci-character-rig-builder-saeed-after.png")
          $env:SAEED_CI_RIG_SCREENSHOT_AFTER = (Join-Path $PWD "dist/ci-character-rig-builder-after.png")
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-character-rig-save.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-character-rig-save.stderr.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-character-rig-builder-save" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddMinutes(4)
          while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!$proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null; throw "Character Engine/Rig Builder save test timed out." }
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          $saveReport = "dist/ci-character-rig-builder-save.json"
          if (!(Test-Path $saveReport)) { throw "Character Engine/Rig Builder save report is missing. $outText $errText" }
          $saved = Get-Content $saveReport -Raw | ConvertFrom-Json
          $failed = @($saved.checks | Where-Object { !$_.passed })
          if ($proc.ExitCode -ne 0 -or !$saved.passed -or $failed.Count -gt 0 -or $saved.checks.Count -lt 15) {
            Write-Host $outText; Write-Host $errText; Write-Host (Get-Content $saveReport -Raw)
            throw "Character Engine/Rig Builder save test failed: exit=$($proc.ExitCode), checks=$($saved.checks.Count), failures=$($failed.Count)."
          }
          foreach ($shot in @("dist/ci-character-rig-builder-before.png","dist/ci-character-rig-builder-after.png")) {
            if (!(Test-Path $shot) -or (Get-Item $shot).Length -lt 1000) { throw "Visual deformation screenshot missing or invalid: $shot" }
          }
          Write-Host "CHARACTER_ENGINE_RIG_BUILDER_SAVE=PASS ($($saved.checks.Count) real-runtime checks)"
          Write-Host (Get-Content $saveReport -Raw)
          $env:SAEED_CI_RIG_REPORT = (Join-Path $PWD "dist/ci-character-rig-builder-verify.json")
          $env:SAEED_CI_RIG_SCREENSHOT_RESTART = (Join-Path $PWD "dist/ci-character-rig-builder-restart.png")
          $verifyOut = Join-Path $env:RUNNER_TEMP "saeed-character-rig-verify.stdout.log"
          $verifyErr = Join-Path $env:RUNNER_TEMP "saeed-character-rig-verify.stderr.log"
          $verify = Start-Process -FilePath $exe -ArgumentList "--ci-character-rig-builder-verify" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $verifyOut -RedirectStandardError $verifyErr
          $verifyDeadline = (Get-Date).AddMinutes(4)
          while (!$verify.HasExited -and (Get-Date) -lt $verifyDeadline) { Start-Sleep -Seconds 1 }
          if (!$verify.HasExited) { & taskkill.exe /PID $verify.Id /T /F | Out-Null; throw "Character Engine/Rig Builder restart verification timed out." }
          $verifyText = if (Test-Path $verifyOut) { Get-Content $verifyOut -Raw } else { "" }
          $verifyError = if (Test-Path $verifyErr) { Get-Content $verifyErr -Raw } else { "" }
          $verifyReport = "dist/ci-character-rig-builder-verify.json"
          if (!(Test-Path $verifyReport)) { throw "Character Engine/Rig Builder restart report is missing. $verifyText $verifyError" }
          $restored = Get-Content $verifyReport -Raw | ConvertFrom-Json
          $restartFailed = @($restored.checks | Where-Object { !$_.passed })
          if ($verify.ExitCode -ne 0 -or !$restored.passed -or $restartFailed.Count -gt 0 -or $restored.checks.Count -lt 6) {
            Write-Host $verifyText; Write-Host $verifyError; Write-Host (Get-Content $verifyReport -Raw)
            throw "Character Engine/Rig Builder restart verification failed: exit=$($verify.ExitCode), checks=$($restored.checks.Count), failures=$($restartFailed.Count)."
          }
          Write-Host "CHARACTER_ENGINE_RIG_BUILDER_RESTART=PASS ($($restored.checks.Count) real-runtime checks)"
          Write-Host (Get-Content $verifyReport -Raw)

      - name: Character, behavior
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\win-unpacked\Saeed AI.exe"
          if (!(Test-Path $exe)) { throw "Character behavior check cannot start: packaged executable is missing: $exe" }
          Write-Host "Running character interaction unit checks..."
          node --test tests/unit/character-behavior-context.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Character interaction unit checks failed." }
          Write-Host "CHARACTER_INTERACTION_UNIT=PASS"
          $report = Join-Path $PWD "dist\ci-character-behavior.json"
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-character-behavior.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-character-behavior.stderr.log"
          $userData = Join-Path $env:RUNNER_TEMP "saeed-character-behavior-user-data"
          $env:SAEED_CI_SMOKE = "1"
          $env:SAEED_CI_ACCEPTANCE_REPORT = $report
          $env:SAEED_CI_USER_DATA = $userData
          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-acceptance" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(180)
          while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!$proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null; throw "Character, behavior check timed out after 180 seconds." }
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          if (!(Test-Path $report)) { throw "Character, behavior report is missing. $outText $errText" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          $failed = @($result.checks | Where-Object { !$_.passed })
          if ($proc.ExitCode -ne 0 -or !$result.passed -or $failed.Count -gt 0 -or $result.checks.Count -lt 10) {
            Write-Host "CHARACTER_BEHAVIOR=FAIL"
            Write-Host $outText
            Write-Host $errText
            Write-Host (Get-Content $report -Raw)
            throw "Character, behavior failed: exit=$($proc.ExitCode), checks=$($result.checks.Count), failed=$($failed.Count)."
          }
          Write-Host "CHARACTER_BEHAVIOR=PASS ($($result.checks.Count) runtime checks)"
          Write-Host $outText
          Write-Host (Get-Content $report -Raw)

      - name: Verify packaged runtime acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\win-unpacked\Saeed AI.exe"
          if (!(Test-Path $exe)) { throw "Packaged executable is missing: $exe" }
          $report = Join-Path $env:RUNNER_TEMP "saeed-packaged-acceptance.json"
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-packaged-acceptance.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-packaged-acceptance.stderr.log"
          $userData = Join-Path $env:RUNNER_TEMP "saeed-packaged-user-data"
          $env:SAEED_CI_SMOKE = "1"
          $env:SAEED_CI_ACCEPTANCE_REPORT = $report
          $env:SAEED_CI_USER_DATA = $userData
          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-acceptance" -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(180)
          while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (!$proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null; throw "Packaged runtime acceptance timed out." }
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          if (!(Test-Path $report)) { throw "Packaged runtime acceptance report is missing. $outText $errText" }
          Copy-Item $report "dist\ci-product-acceptance.json" -Force
          $acceptance = Get-Content $report -Raw | ConvertFrom-Json
          $failed = @($acceptance.checks | Where-Object { !$_.passed })
          if ($proc.ExitCode -ne 0 -or !$acceptance.passed -or $failed.Count -gt 0) {
            Write-Host $outText
            Write-Host $errText
            Write-Host (Get-Content $report -Raw)
            throw "Packaged runtime acceptance failed with exit code $($proc.ExitCode) and $($failed.Count) failed check(s)."
          }
          Write-Host "PACKAGED_RUNTIME_ACCEPTANCE=PASS ($($acceptance.checks.Count) checks)"
          Write-Host (Get-Content $report -Raw)

      - name: Verify rest pose survives a full application restart
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\win-unpacked\Saeed AI.exe"
          $userData = Join-Path $env:RUNNER_TEMP "saeed-rest-pose-restart-user-data"
          $state = Join-Path $env:RUNNER_TEMP "saeed-rest-pose-restart-state.json"
          $saveReport = Join-Path $env:RUNNER_TEMP "saeed-rest-pose-save.json"
          $verifyReport = Join-Path $env:RUNNER_TEMP "saeed-rest-pose-verify.json"
          if (Test-Path $userData) { Remove-Item $userData -Recurse -Force }
          if (Test-Path $state) { Remove-Item $state -Force }
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $env:SAEED_CI_SMOKE = "1"
          $env:SAEED_CI_USER_DATA = $userData
          $env:SAEED_CI_REST_POSE_STATE = $state
          function Invoke-RestPoseProcess($argument, $reportPath, $label) {
            $stdout = Join-Path $env:RUNNER_TEMP ("saeed-rest-pose-" + $label + ".stdout.log")
            $stderr = Join-Path $env:RUNNER_TEMP ("saeed-rest-pose-" + $label + ".stderr.log")
            $env:SAEED_CI_REST_POSE_REPORT = $reportPath
            $proc = Start-Process -FilePath $exe -ArgumentList $argument -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(120)
            while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            if (!$proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null; throw "Rest-pose $label process timed out." }
            $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
            if (!(Test-Path $reportPath)) { throw "Rest-pose $label report is missing. $outText $errText" }
            $result = Get-Content $reportPath -Raw | ConvertFrom-Json
            $failed = @($result.checks | Where-Object { !$_.passed })
            if ($proc.ExitCode -ne 0 -or !$result.passed -or $failed.Count -gt 0) {
              Write-Host $outText
              Write-Host $errText
              Write-Host (Get-Content $reportPath -Raw)
              throw "Rest-pose $label acceptance failed with exit code $($proc.ExitCode) and $($failed.Count) failed check(s)."
            }
            Copy-Item $reportPath ("dist\ci-rest-pose-" + $label + ".json") -Force
            Write-Host ("REST_POSE_RESTART_" + $label.ToUpper() + "=PASS (" + $result.checks.Count + " checks)")
          }
          Invoke-RestPoseProcess "--ci-rest-pose-save" $saveReport "save"
          if (!(Test-Path $state)) { throw "The first process did not write the rest-pose state marker." }
          Invoke-RestPoseProcess "--ci-rest-pose-verify" $verifyReport "verify"
          Remove-Item $userData -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $state -Force -ErrorAction SilentlyContinue

      - name: Build optional add-on bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/addons"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          function Build-NpmAddon($id,$name,$package,$version,$category,$capabilities) {
            $stage = Join-Path $env:RUNNER_TEMP ("saeed-addon-" + $id)
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            npm install --prefix $stage "$package@$version" --omit=dev --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Failed to install add-on package $package@$version" }
            $manifest = [ordered]@{schemaVersion=1;id=$id;name=$name;version=$version;category=$category;capabilities=$capabilities;installType="bundle";packageName=$package;description=$name}
            $manifest | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $stage "manifest.json")
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath (Join-Path $root ("saeed-addon-" + $id + ".zip")) -Force
            Remove-Item $stage -Recurse -Force
          }
          Build-NpmAddon "word" "Word / DOCX" "docx" "9.8.1" "Documents" @("documents")
          Build-NpmAddon "excel" "Excel / XLSX" "xlsx" "0.18.5" "Documents" @("documents","spreadsheet")
          Build-NpmAddon "pdf" "PDF" "pdf-parse" "1.1.1" "Documents" @("documents","pdf")
          Build-NpmAddon "ocr" "OCR" "tesseract.js" "6.0.1" "Vision" @("ocr","vision")
          foreach ($id in @("word","excel","pdf","ocr")) {
            $zip = Join-Path $root ("saeed-addon-" + $id + ".zip")
            if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 1000) { throw "Missing or invalid add-on bundle: $zip" }
          }
          Write-Host "ADDON_BUNDLES=PASS"

      - name: Upload current build and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Saeed-AI-current-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
            dist/latest.yml
            dist/ci-product-acceptance.json
            dist/ci-character-behavior.json
            dist/ci-character-rig-builder-*.json
            dist/ci-character-rig-builder-*.png
            dist/ci-static-humanoid.glb
            dist/ci-rest-pose-save.json
            dist/ci-rest-pose-verify.json
            THIRD_PARTY_NOTICES.txt
            build/whisper-runtime/WHISPER-CPP-LICENSE.txt
            dist/icons/*
            dist/addons/*.zip
            ci-reports/current-acceptance.json

      - name: Publish official release
        if: success() && inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          echo "Release request accepted for ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml dist/addons/*.zip --clobber
          else
            gh release create "${TAG}" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml dist/addons/*.zip \
              --title "Saeed AI ${VERSION}" \
              --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
              --target "${{ github.sha }}"
          fi
