name: Saeed AI — Windows Build

# Automatic builds are intentionally disabled during development.
# Builds run only when manually requested from GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified build as the official release for VERSION"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Validate version identity
        id: version
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR, found: $releaseVersion" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") { throw "package.json version $($pkg.version) does not match VERSION $releaseVersion (expected $releaseVersion.0)" }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion must equal package.json version" }
          $officialTag = "v$releaseVersion"
          "official_tag=$officialTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $testTagPattern = '^v' + [regex]::Escape($pkg.version) + '-test(\.\d+)*$'
            if ($env:GITHUB_REF_NAME -eq $officialTag) {
              Write-Host "Official release tag validated: $env:GITHUB_REF_NAME"
            } elseif ($env:GITHUB_REF_NAME -match $testTagPattern) {
              Write-Host "Test build tag validated: $env:GITHUB_REF_NAME (will not publish to the stable release)"
            } else {
              throw "Release tag $env:GITHUB_REF_NAME must be $officialTag or match v$($pkg.version)-test.<build>"
            }
          }
          Write-Host "Official product version: v$releaseVersion"
          Write-Host "Workflow build number: $env:GITHUB_RUN_NUMBER"

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/character/CharacterEngine.js","src/renderer/character.html","src/main/conversation/conversation-agent.js","src/realtime.js","src/main/automation/local-executor.js","src/tools/registry.js","src/main/brain/brain.js","src/main/brain/model-executor.js","src/main/ci-e2e.js","src/main/runtime.js","src/main/application/brain-host.js","src/main/voice/voice-host.js","src/renderer/voice/voice-client.js","src/character/CharacterController.js","src/character/CharacterRig.js","src/character/CharacterRetargeter.js","src/character/AnimationController.js","src/character/AutonomousBehaviorController.js","src/character/MotionRegistry.js","src/character/MotionEditor.js","src/character/FaceController.js","src/character/FingerController.js","src/character/AutoRigMapper.js","src/character/client.js","src/character-studio.html","src/three/GLTFLoader.js","src/main/character/character-host.js","src/index.html","src/performance.html","src/performance.js","src/performance.css")
          foreach ($path in $required) { if (-not (Test-Path $path -PathType Leaf)) { throw "Required project file is missing: $path" } }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize validation reports
        id: init_validation_reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ci-reports" | Out-Null
          Remove-Item "ci-reports\*" -Force -ErrorAction SilentlyContinue
          Write-Host "Validation report directory initialized: ci-reports/"

      - name: Character component diagnostics
        id: character_diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/01-character-diagnostics.txt"
          "=== CHARACTER COMPONENT DIAGNOSTICS ===" | Set-Content $report
          node scripts/ci-character-diagnostics.js 2>&1 | Tee-Object -FilePath $report -Append
          $code=$LASTEXITCODE
          Add-Content $report "EXIT_CODE=$code"
          Add-Content $report "STATUS=$(if($code -eq 0){'PASS'}else{'FAIL'})"
          Get-Content $report -Raw | Write-Host
          if($code -ne 0){Write-Warning "Character diagnostics failed; continuing." ; exit 1}
          Write-Host "CHARACTER_DIAGNOSTICS=PASS"
      - name: Application RAM startup diagnostic (non-gating)
        continue-on-error: true
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Continue"
          $electron = Join-Path $PWD "node_modules/electron/dist/electron.exe"
          if (!(Test-Path $electron)) {
            Write-Warning "Electron executable not found; RAM diagnostic skipped."
            exit 0
          }
          $proc = Start-Process -FilePath $electron -ArgumentList ".", "--exit" -PassThru
          $peakMB = 0
          $samples = 0
          $deadline = (Get-Date).AddSeconds(30)
          function Get-DescendantIds([int]$rootPid) {
            $all = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $ids = New-Object System.Collections.Generic.List[int]
            $queue = New-Object System.Collections.Generic.Queue[int]
            $queue.Enqueue($rootPid)
            while($queue.Count -gt 0) {
              $processId = $queue.Dequeue()
              if($ids.Contains($processId)){ continue }
              $ids.Add($processId)
              foreach($child in $all | Where-Object { $_.ParentProcessId -eq $processId }) { $queue.Enqueue([int]$child.ProcessId) }
            }
            return $ids
          }
          while(!$proc.HasExited -and (Get-Date) -lt $deadline) {
            $sum = 0
            foreach($processId in (Get-DescendantIds $proc.Id)) {
              try { $p=Get-Process -Id $processId -ErrorAction Stop; $sum += [int64]$p.WorkingSet64 } catch {}
            }
            $mb=[math]::Round($sum/1MB,1)
            if($mb -gt $peakMB){$peakMB=$mb}
            $samples++
            Start-Sleep -Milliseconds 500
          }
          if(!$proc.HasExited){
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Warning "RAM diagnostic process exceeded 30 seconds."
          }
          Write-Host "RAM_DIAGNOSTIC_SAMPLES=$samples"
          Write-Host "RAM_DIAGNOSTIC_PEAK_MB=$peakMB"
          Write-Host "RAM_DIAGNOSTIC_NON_GATING=true"

      - name: Character Studio and runtime component contract
        id: character_contract
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/02-character-contract.txt"
          $errors=[System.Collections.Generic.List[string]]::new()
          $required=@("src/character/CharacterEngine.js","src/character/CharacterController.js","src/character/CharacterRig.js","src/character/CharacterRetargeter.js","src/character/AnimationController.js","src/character/AutonomousBehaviorController.js","src/character/MotionRegistry.js","src/character/MotionEditor.js","src/character/FaceController.js","src/character/FingerController.js","src/character/AutoRigMapper.js","src/character/client.js","src/character-studio.html","src/three/GLTFLoader.js")
          foreach($p in $required){if(!(Test-Path $p -PathType Leaf)){$errors.Add("Missing component: $p")}}
          $engine=if(Test-Path "src/character/CharacterEngine.js"){Get-Content "src/character/CharacterEngine.js" -Raw}else{""}
          $controller=if(Test-Path "src/character/CharacterController.js"){Get-Content "src/character/CharacterController.js" -Raw}else{""}
          $studio=if(Test-Path "src/character-studio.html"){Get-Content "src/character-studio.html" -Raw}else{""}
          $client=if(Test-Path "src/character/client.js"){Get-Content "src/character/client.js" -Raw}else{""}
          foreach($c in @(@($engine,"setBoneRotation"),@($engine,"bindRig"),@($engine,"captureAuthoritativeRestPose"),@($controller,"setBehavior"),@($controller,"setMotionEnabled"),@($controller,"bindSlot"),@($client,"bindSlot"),@($client,"setBoneRotation"),@($studio,"GLTFLoader"),@($studio,"setBoneRotation"),@($studio,"bindSlot"))){if(!$c[0].Contains($c[1])){$errors.Add("Missing contract: $($c[1])")}}
          if($studio -notmatch 'import \* as THREE from "./node_modules/three/build/three.module.js"'){$errors.Add("Studio Three.js import missing")}
          if($studio -notmatch 'from "./three/GLTFLoader.js"'){$errors.Add("Studio GLTFLoader import missing")}
          if($studio -notmatch 'onCharacterSelected'){$errors.Add("Studio selected-character event missing")}
          @("=== CHARACTER STUDIO / RUNTIME CONTRACT ===","Checked: $($required.Count)","Errors: $($errors.Count)")|Set-Content $report
          if($errors.Count){$errors|Add-Content $report}else{"NO_CONTRACT_ERRORS"|Add-Content $report}
          Add-Content $report "STATUS=$(if($errors.Count){'FAIL'}else{'PASS'})"
          Get-Content $report -Raw|Write-Host
          if($errors.Count){exit 1}
          Write-Host "CHARACTER_STUDIO_COMPONENTS=PASS"
          Write-Host "CHARACTER_LIVE_EDITING_CONTRACT=PASS"
      - name: Static JavaScript validation
        id: static_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/03-npm-test.txt"
          "=== NPM TEST ==="|Set-Content $report
          npm test 2>&1|Tee-Object -FilePath $report -Append
          $code=$LASTEXITCODE
          Add-Content $report "EXIT_CODE=$code"
          Add-Content $report "STATUS=$(if($code -eq 0){'PASS'}else{'FAIL'})"
          Get-Content $report -Raw|Write-Host
          if($code -ne 0){exit 1}
      - name: JavaScript syntax validation — all files
        id: js_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/04-js-syntax.txt"
          $errors=[System.Collections.Generic.List[string]]::new()
          $files=@(Get-ChildItem "src" -Recurse -Filter "*.js" -File)
          "=== JAVASCRIPT SYNTAX VALIDATION ==="|Set-Content $report
          "Files checked: $($files.Count)"|Add-Content $report
          foreach($file in $files){node --check $file.FullName 2>&1|Tee-Object -FilePath $report -Append;if($LASTEXITCODE -ne 0){$errors.Add($file.FullName);Add-Content $report "SYNTAX_ERROR=$($file.FullName)"}}
          Add-Content $report "ERROR_COUNT=$($errors.Count)"
          Add-Content $report "STATUS=$(if($errors.Count){'FAIL'}else{'PASS'})"
          Get-Content $report -Raw|Write-Host
          if($errors.Count){exit 1}

      - name: HTML module syntax validation — all files
        id: html_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/05-html-syntax.txt"
          $errors=[System.Collections.Generic.List[string]]::new()
          $html=@(Get-ChildItem "src" -Recurse -Filter "*.html" -File)
          "=== HTML MODULE SYNTAX VALIDATION ==="|Set-Content $report
          foreach($file in $html){$raw=Get-Content $file.FullName -Raw;$matches=[regex]::Matches($raw,'<script[^>]*type="module"[^>]*>([\s\S]*?)</script>');$i=0;foreach($m in $matches){$tmp=Join-Path $env:RUNNER_TEMP ("html-script-"+[guid]::NewGuid().ToString("N")+".mjs");Set-Content $tmp $m.Groups[1].Value -Encoding UTF8;node --check $tmp 2>&1|Tee-Object -FilePath $report -Append;if($LASTEXITCODE -ne 0){$errors.Add("$($file.FullName) block $i")};Remove-Item $tmp -Force -ErrorAction SilentlyContinue;$i++};Add-Content $report "HTML=$($file.FullName) MODULE_BLOCKS=$i"}
          Add-Content $report "ERROR_COUNT=$($errors.Count)"
          Add-Content $report "STATUS=$(if($errors.Count){'FAIL'}else{'PASS'})"
          Get-Content $report -Raw|Write-Host
          if($errors.Count){exit 1}

      - name: Dependency integrity validation
        id: dependency_validation
        continue-on-error: true
        shell: pwsh
        run: |
          $report="ci-reports/06-dependencies.txt"
          $errors=[System.Collections.Generic.List[string]]::new()
          "=== DEPENDENCY INTEGRITY ==="|Set-Content $report
          $pkg=Get-Content "package.json" -Raw|ConvertFrom-Json
          $deps=@($pkg.dependencies.PSObject.Properties.Name+$pkg.devDependencies.PSObject.Properties.Name)
          foreach($dep in $deps){if(!(Test-Path "node_modules\$dep")){$errors.Add("Missing installed dependency: $dep")}else{Add-Content $report "OK $dep"}}
          npm ls --depth=0 2>&1|Tee-Object -FilePath $report -Append
          if($LASTEXITCODE -ne 0){$errors.Add("npm ls reported dependency problems")}
          Add-Content $report "ERROR_COUNT=$($errors.Count)"
          if($errors.Count){$errors|Add-Content $report}
          Add-Content $report "STATUS=$(if($errors.Count){'FAIL'}else{'PASS'})"
          Get-Content $report -Raw|Write-Host
          if($errors.Count){exit 1}

      - name: Print complete validation reports and gate
        id: validation_gate
        continue-on-error: true
        shell: pwsh
        run: |
          $reports=@(Get-ChildItem "ci-reports" -File|Sort-Object Name)
          $failed=@()
          Write-Host "================ COMPLETE VALIDATION REPORTS ================"
          foreach($r in $reports){Write-Host "---------------- $($r.Name) ----------------";Get-Content $r.FullName -Raw|Write-Host;if((Get-Content $r.FullName -Raw)-match "STATUS=FAIL"){$failed+=$r.Name}}
          Write-Host "================ SUMMARY ================"
          Write-Host "Reports: $($reports.Count)"
          Write-Host "Failed: $($failed.Count)"
          if($failed.Count){$failed|ForEach-Object{Write-Host "FAIL: $_"};Write-Host "ALL_VALIDATIONS=FAIL";exit 1}
          Write-Host "ALL_VALIDATIONS=PASS"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Saeed-AI-validation-reports-\${{ github.run_number }}
          if-no-files-found: warn
          path: ci-reports/*

      - name: Stop before build when validation reports contain errors
        id: validation_final_gate
        shell: pwsh
        run: |
          $reports=@(Get-ChildItem "ci-reports" -File|Sort-Object Name)
          $failed=@($reports|Where-Object{(Get-Content $_.FullName -Raw)-match "STATUS=FAIL"})
          Write-Host "Validation reports uploaded before final gate."
          Write-Host "Reports generated: $($reports.Count)"
          Write-Host "Reports with failures: $($failed.Count)"
          if($failed.Count){$failed|ForEach-Object{Write-Host "FAIL: $($_.Name)"};throw "Validation gate failed. The complete validation artifact has already been uploaded."}
          Write-Host "VALIDATION_GATE=PASS"

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "assets/saeed.png"
          $icon = "assets/saeed.ico"
          $iconDir = "dist/icons"
          if (!(Test-Path $source)) { throw "Source Saeed PNG is missing: $source" }
          if (!(Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick --yes --no-progress }
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null
          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick failed to generate $icon" }
          if (!(Test-Path $icon)) { throw "Saeed.ico was not generated from Saeed.png." }
          if ((Get-Item $icon).Length -lt 1000) { throw "Windows icon is unexpectedly small." }
          & magick identify $icon
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected." }
          $sizes = @(256,128,64,48,32,16)
          for ($index = 0; $index -lt $sizes.Count; $index++) {
            $size = $sizes[$index]
            $out = Join-Path $iconDir "saeed-$size.png"
            # ICO frames are indexed by image number in ImageMagick; use the
            # verified frame order from identify rather than a WxH selector.
            & magick "${icon}[$index]" -background none -alpha on $out
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $out)) {
              throw "Failed to extract $size x $size icon."
            }
          }
          Copy-Item $icon (Join-Path $iconDir "saeed.ico") -Force
          Write-Host "Saved generated icons:"
          Get-ChildItem $iconDir | Select-Object Name,Length

      - name: Pre-build application smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-prebuild-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-prebuild-smoke.stderr.log"
          $env:SAEED_CI_SMOKE = "1"
          $proc = Start-Process -FilePath "node" -ArgumentList "node_modules/electron/cli.js", ".", "--exit" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(120)
            while (!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            if (!$proc.HasExited) {
              & taskkill.exe /PID $proc.Id /T /F | Out-Null
              $proc.WaitForExit(10000)
              $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
              $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "Application smoke test timed out after 120 seconds. stdout: $outText stderr: $errText"
            }
            $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
            $proc.Refresh()
            $exitCode = $proc.ExitCode
            if ($null -ne $exitCode -and $exitCode -ne 0) { throw "Application smoke test failed with exit code $exitCode. $outText $errText" }
            Write-Host "PRE_BUILD_APPLICATION_SMOKE=PASS"
            Write-Host $outText
            if ($errText) { Write-Host $errText }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prepare embedded Whisper runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "build\\whisper-runtime"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (Test-Path "build\\whisper-src") { Remove-Item "build\\whisper-src" -Recurse -Force }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git build\\whisper-src
          cmake -S build\\whisper-src -B build\\whisper-src\\build -A x64 -DBUILD_SHARED_LIBS=ON -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF
          cmake --build build\\whisper-src\\build --config Release --target whisper-cli
          $cli = Get-ChildItem "build\\whisper-src\\build" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe was not built." }
          Copy-Item $cli.FullName (Join-Path $root "whisper-cli.exe") -Force
          $dllDir = Split-Path $cli.FullName -Parent
          Get-ChildItem $dllDir -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $root -Force }
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" -OutFile (Join-Path $root "ggml-base-q5_1.bin")
          $hash = (Get-FileHash (Join-Path $root "ggml-base-q5_1.bin") -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898") { throw "Whisper model SHA256 mismatch: $hash" }
          & (Join-Path $root "whisper-cli.exe") --help | Out-File (Join-Path $root "whisper-help.txt")
          if ($LASTEXITCODE -ne 0) { throw "Embedded Whisper CLI startup check failed." }
          Remove-Item "build\\whisper-src" -Recurse -Force
          Write-Host "EMBEDDED_WHISPER=PASS"
          Get-ChildItem $root | Select-Object Name,Length

      - name: Build Windows installer
        run: npm run dist

      - name: Verify packaged runtime assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $PWD "dist\\win-unpacked"
          $required = @("Saeed AI.exe","resources\\app.asar")
          foreach($rel in $required){$p=Join-Path $root $rel;if(!(Test-Path $p -PathType Leaf)){throw "Packaged core asset missing: $p";}}
          Write-Host "PACKAGED_APP_ASAR=PASS"
          $whisperRoot = Join-Path $root "resources\\whisper"
          foreach($rel in @("whisper-cli.exe","ggml-base-q5_1.bin")) { $p=Join-Path $whisperRoot $rel; if(!(Test-Path $p -PathType Leaf)){throw "Embedded Whisper asset missing: $p"} }
          Write-Host "PACKAGED_CORE_HAS_EMBEDDED_WHISPER=PASS"

      - name: Packaged EXE end-to-end UI, Brain, Voice and lifecycle test
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = "Stop"
          $report = Join-Path $PWD "dist\ci-e2e-report.json"
          $stdout = Join-Path $env:RUNNER_TEMP "saeed-e2e.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "saeed-e2e.stderr.log"
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD "dist\win-unpacked\Saeed AI.exe"
          if (!(Test-Path $exe -PathType Leaf)) { throw "Packaged EXE missing: $exe" }
          $env:SAEED_CI_E2E_REPORT = $report
          $proc = Start-Process -FilePath $exe -ArgumentList "--ci-e2e" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline=(Get-Date).AddSeconds(420)
          while(!$proc.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if(!$proc.HasExited){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "Packaged E2E test timed out after 420 seconds." }
          if(Test-Path $stdout){Get-Content $stdout -Raw|Write-Host}
          if(Test-Path $stderr){Get-Content $stderr -Raw|Write-Host}
          if(!(Test-Path $report)){@{startedAt=(Get-Date).ToUniversalTime().ToString("o");finishedAt=(Get-Date).ToUniversalTime().ToString("o");pass=$false;error="Packaged E2E did not produce ci-e2e-report.json";checks=@{}}|ConvertTo-Json -Depth 8|Set-Content $report -Encoding UTF8; Write-Warning "Packaged E2E did not produce a report; preserving synthetic failure report and continuing."}
          $result=Get-Content $report -Raw|ConvertFrom-Json
          Get-Content $report -Raw
          if(-not $result.pass){Write-Warning "Packaged EXE E2E validation failed. The detailed report will be uploaded for diagnosis; the final E2E gate runs after artifact upload."}
          Write-Host "PACKAGED_EXE_E2E=PASS"
          Write-Host "PACKAGED_EXE_CHAT_BRAIN_VOICE_LIFECYCLE=PASS"

      - name: Verify packaged EXE E2E reports
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach($p in @("dist\ci-e2e-report.json")) {
            if (!(Test-Path $p)) { throw "Required packaged E2E report missing: $p" }
            $item=Get-Item $p
            Write-Host "Verified E2E report: $p ($($item.Length) bytes)"
          }

      - name: Generate Windows updater metadata
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()+".0"
          $f=@(Get-ChildItem dist -Filter "*.exe"|Where-Object{$_.Name-notlike"*uninstaller*"})[0]
          if(!$f){throw "Installer missing"}
          $h=(Get-FileHash $f.FullName -Algorithm SHA512).Hash
          $b=[Convert]::ToBase64String([Convert]::FromHexString($h))
          @{version=$v;files=@(@{url=$f.Name;sha512=$b;size=[int64]$f.Length});releaseDate=(Get-Date).ToUniversalTime().ToString("o")}|ConvertTo-Json -Depth 5|Set-Content dist/latest.yml -Encoding UTF8
          Write-Host "UPDATE_METADATA_CHECK=PASS"

      - name: Build optional add-on bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/addons"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          function Build-NpmAddon($id,$name,$package,$version,$category,$capabilities) {
            $stage = Join-Path $env:RUNNER_TEMP ("saeed-addon-" + $id)
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            npm install --prefix $stage "$package@$version" --omit=dev --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Failed to install add-on package $package@$version" }
            $manifest = [ordered]@{
              schemaVersion=1; id=$id; name=$name; version=$version; category=$category
              capabilities=$capabilities
              installType="bundle"; packageName=$package; description=$name
            }
            $manifest | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $stage "manifest.json")
            $zip = Join-Path $root ("saeed-addon-" + $id + ".zip")
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
            Remove-Item $stage -Recurse -Force
            Write-Host "Built add-on: $zip"
          }

          Build-NpmAddon "word" "Word / DOCX" "docx" "9.8.1" "Documents" @("documents")
          Build-NpmAddon "excel" "Excel / XLSX" "xlsx" "0.18.5" "Documents" @("documents","spreadsheet")
          Build-NpmAddon "pdf" "PDF" "pdf-parse" "1.1.1" "Documents" @("documents","pdf")
          Build-NpmAddon "ocr" "OCR" "tesseract.js" "6.0.1" "Vision" @("ocr","vision")


          Get-ChildItem $root | Select-Object Name,Length

      - name: Verify add-on bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("word","excel","pdf","ocr")
          foreach($id in $required) {
            $zip = "dist/addons/saeed-addon-$id.zip"
            if (!(Test-Path $zip)) { throw "Missing add-on bundle: $zip" }
            if ((Get-Item $zip).Length -lt 1000) { throw "Add-on bundle is unexpectedly small: $zip" }
          }
          Write-Host "ADDON_BUNDLES=PASS"

      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if (-not (Test-Path "dist" -PathType Container)) { throw "dist directory was not created" }
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer version mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $blockmaps = @(Get-ChildItem "dist" -Filter "*.blockmap" -File)
          if ($blockmaps.Count -lt 1) { throw "Installer blockmap is missing" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
            dist/latest.yml
            dist/ci-e2e-report.json
            animation-health-report.json
            dist/icons/*
            dist/addons/*.zip
            ci-reports/*


      - name: Final packaged E2E result gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $result=Get-Content "dist\\ci-e2e-report.json" -Raw|ConvertFrom-Json
          if(-not $result.pass){
            Write-Host "PACKAGED_EXE_E2E=FAIL (detailed report was preserved and uploaded)"
            throw "Packaged EXE E2E validation failed. Review dist/ci-e2e-report.json."
          }
          Write-Host "PACKAGED_EXE_E2E=PASS"

      - name: Publish official release
        if: (github.ref == format('refs/tags/{0}', steps.version.outputs.official_tag)) || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          echo "Release request accepted for $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading verified build assets instead of failing."
            gh release upload "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml dist/addons/*.zip --clobber
          else
            gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml dist/addons/*.zip \
              --title "Saeed AI ${VERSION}" \
              --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
              --target "${{ github.sha }}"
          fi
