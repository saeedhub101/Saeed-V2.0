name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/build-windows-electron.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the verified build as the official release for VERSION"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: true

# Build validation trigger: ensures the latest source commit is validated after syntax fixes.
