name: Saeed AI — Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'VERSION'
      - '.github/workflows/build-windows-electron.yml'
      - 'BUILD_RULES.md'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release for the VERSION in this commit'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: saeed-windows-build-main
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Validate version identity
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if ($releaseVersion -notmatch '^\d+\.\d+$') { throw "VERSION must be MAJOR.MINOR, found: $releaseVersion" }
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne "$releaseVersion.0") {
            throw "package.json version $($pkg.version) does not match VERSION $releaseVersion (expected $releaseVersion.0)"
          }
          if ($pkg.build.buildVersion -ne $pkg.version) { throw "Electron buildVersion must equal package.json version" }
          Write-Host "Official product version: v$releaseVersion"
          Write-Host "Workflow build number: $env:GITHUB_RUN_NUMBER"

      - name: Validate repository structure
        shell: pwsh
        run: |
          $required = @("package.json","VERSION","src/main.js","src/preload.js","src/renderer.js","src/avatar.js","src/character.html","src/3d-status.html","src/3d-status.js","src/3d-status.css","src/three/GLTFLoader.js","src/three/BufferGeometryUtils.js","src/index.html","src/agent.js","src/local-brain.js","src/realtime.js","src/tools.js","src/performance.html","src/performance.js","src/performance.css")
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required project file is missing: $path" }
          }


      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static JavaScript validation
        run: npm test

      - name: Prepare native Windows icon
        shell: pwsh
        run: |
          $source = "assets/saeed.png"
          $icon = "assets/saeed.ico"
          if (!(Test-Path $source)) { throw "Source Saeed PNG is missing: $source" }
          if (!(Get-Command magick -ErrorAction SilentlyContinue)) { choco install imagemagick --yes --no-progress }
          & magick $source -background none -define icon:auto-resize=256,128,64,48,32,16 $icon
          if ($LASTEXITCODE -ne 0) { throw "ImageMagick failed to generate $icon" }
          if (!(Test-Path $icon)) { throw "Saeed.ico was not generated from Saeed.png." }
          $bytes = (Get-Item $icon).Length
          if ($bytes -lt 1000) { throw "Windows icon is unexpectedly small: $bytes bytes" }
          & magick identify $icon
          if ($LASTEXITCODE -ne 0) { throw "Generated ICO could not be inspected." }
          Write-Host "Native Windows icon generated from Saeed.png: $icon"

      - name: Build bundled Offline Whisper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "build\whisper") { Remove-Item "build\whisper" -Recurse -Force }
          if (Test-Path "build\whisper-src") { Remove-Item "build\whisper-src" -Recurse -Force }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git build\whisper-src
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-devel-2.28.5-VC.zip" -OutFile "build\SDL2.zip"
          7z x "build\SDL2.zip" -obuild\sdl2 | Out-Null
          $sdl = (Get-ChildItem "build\sdl2" -Directory | Select-Object -First 1).FullName
          cmake -S build\whisper-src -B build\whisper-src\build -A x64 -DBUILD_SHARED_LIBS=ON -DWHISPER_SDL2=ON -DWHISPER_BUILD_EXAMPLES=ON -DSDL2_DIR="$sdl\cmake" -DGGML_NATIVE=OFF
          cmake --build build\whisper-src\build --config Release --target whisper-stream --target whisper-cli
          New-Item -ItemType Directory -Force -Path build\whisper | Out-Null
          $stream = Get-ChildItem "build\whisper-src\build" -Recurse -Filter "whisper-stream.exe" | Select-Object -First 1
          if (!$stream) { throw "whisper-stream.exe was not built." }
          $cli = Get-ChildItem "build\whisper-src\build" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe was not built." }
          Copy-Item $cli.FullName "build\whisper\whisper-cli.exe" -Force
          Copy-Item $stream.FullName "build\whisper\whisper-stream.exe" -Force
          Get-ChildItem "build\whisper-src\build\bin\Release" -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName "build\whisper\$($_.Name)" -Force }
          $sdlDll = Get-ChildItem $sdl -Recurse -Filter "SDL2.dll" | Select-Object -First 1
          if (!$sdlDll) { throw "SDL2.dll was not found." }
          Copy-Item $sdlDll.FullName "build\whisper\SDL2.dll" -Force
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin" -OutFile "build\whisper\ggml-base-q5_1.bin"
          $size = (Get-Item "build\whisper\ggml-base-q5_1.bin").Length
          if ($size -lt 50000000) { throw "Whisper model download is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash "build\whisper\ggml-base-q5_1.bin" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898") { throw "Whisper model SHA256 mismatch: $hash" }
          & "build\whisper\whisper-stream.exe" --help | Out-File "build\whisper\whisper-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Whisper stream binary failed its startup/help check." }
          Write-Host "OFFLINE_WHISPER_READY modelBytes=$size sha256=$hash"

      - name: Build Windows installer
        run: npm run build



      - name: Launch built program and verify chat screen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "dist\win-unpacked\Saeed AI.exe"
          if (-not (Test-Path $app -PathType Leaf)) { throw "Built application was not found: $app" }

          $debugPort = 9222
          $proc = Start-Process -FilePath $app -ArgumentList "--chat --remote-debugging-port=$debugPort" -PassThru
          try {
            @'
          const http = require("http");
          const WebSocket = require("ws");
          const port = Number(process.argv[2]);
          const expression = String(process.argv[3] || "");
          const needle = String(process.argv[4] || "index.html");
          const getTargets = () => new Promise((resolve,reject) => {
            http.get(`http://127.0.0.1:${port}/json`, res => {
              let data="";
              res.setEncoding("utf8");
              res.on("data", chunk => data += chunk);
              res.on("end", () => { try { resolve(JSON.parse(data)); } catch(e) { reject(e); } });
            }).on("error", reject);
          });
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async()=>{
            let target=null;
            for(let i=0;i<30;i++){
              try{
                const targets=await getTargets();
                target=targets.find(x=>x.type==="page"&&x.webSocketDebuggerUrl&&((x.url||"").includes(needle)||(needle==="index.html"&&x.title==="Saeed AI")));
                if(target)break;
              }catch{}
              await sleep(1000);
            }
            if(!target)throw new Error("Saeed did not expose the chat Chromium page.");
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.once("open",resolve);ws.once("error",reject);});
            const evaluate=()=>new Promise((resolve,reject)=>{
              const timer=setTimeout(()=>reject(new Error("CDP Runtime.evaluate timed out")),10000);
              const onMessage=raw=>{
                try{
                  const m=JSON.parse(raw.toString());
                  if(m.id!==1)return;
                  clearTimeout(timer);
                  ws.off("message",onMessage);
                  if(m.error)reject(new Error(m.error.message||"CDP error"));
                  else resolve(m.result?.result?.value);
                }catch(e){clearTimeout(timer);ws.off("message",onMessage);reject(e);}
              };
              ws.on("message",onMessage);
              ws.send(JSON.stringify({id:1,method:"Runtime.evaluate",params:{expression,returnByValue:true,awaitPromise:true}}));
            });
            let value=null;
            for(let i=0;i<30;i++){
              try{
                value=JSON.parse(await evaluate());
                if(value?.title==="Saeed AI"&&value?.panel&&value?.panelVisible&&value?.welcome&&value?.closeButton)break;
              }catch(e){}
              await sleep(500);
            }
            ws.close();
            process.stdout.write(JSON.stringify(value||{}));
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1);});
          '@ | Set-Content -Path (Join-Path $PWD "dist\cdp-smoke.cjs") -Encoding UTF8
            $expression = 'JSON.stringify({title:document.title,panel:!!document.querySelector("#panel"),panelVisible:document.querySelector("#panel")?.classList.contains("visible"),welcome:document.body?.innerText?.includes("Hello, I’m Saeed."),closeButton:!!document.querySelector("#closeChat")})'
            $json = & node (Join-Path $PWD "dist\cdp-smoke.cjs") $debugPort $expression
            if ($LASTEXITCODE -ne 0) { throw "CDP chat smoke failed." }
            $value = $json | ConvertFrom-Json
            Write-Host "Runtime page title: $($value.title)"
            Write-Host "Chat panel found: $($value.panel)"
            Write-Host "Chat panel visible: $($value.panelVisible)"
            Write-Host "Chat welcome rendered: $($value.welcome)"
            Write-Host "Chat close button found: $($value.closeButton)"
            if ($value.title -ne "Saeed AI") { throw "Unexpected application page title: $($value.title)" }
            if (-not $value.panel) { throw "Chat panel was not found in the running application." }
            if (-not $value.panelVisible) { throw "Chat panel exists but is not visible." }
            if (-not $value.welcome) { throw "Chat welcome message was not rendered." }
            if (-not $value.closeButton) { throw "Chat close button was not rendered." }
            Write-Host "CHAT_SMOKE=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$PWD\dist\win-unpacked\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify 3D renderer, diagnostic object, and 3D status
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $PWD "dist\\win-unpacked\\Saeed AI.exe"
          $debugPort = 9227
          $proc = Start-Process -FilePath $app -ArgumentList "--remote-debugging-port=$debugPort" -PassThru
          try {
            Start-Sleep -Seconds 12
            $expression = 'JSON.stringify({title:document.title,frame:!!document.querySelector("#characterFrame"),canvas:!!document.querySelector("#avatar"),avatarApi:!!window.saeedAvatar,status:window.saeedAvatar?.get3DStatus?.(),bootstrap:window.saeed3DBootstrap})'
            $json = & node (Join-Path $PWD "dist\\cdp-smoke.cjs") $debugPort $expression "character.html"
            if ($LASTEXITCODE -ne 0) { throw "CDP 3D smoke failed." }
            $value = $json | ConvertFrom-Json
            Write-Host "3D page title: $($value.title)"
            Write-Host "3D frame found: $($value.frame)"
            Write-Host "3D canvas found: $($value.canvas)"
            Write-Host "3D avatar API found: $($value.avatarApi)"
            Write-Host ($value.status | ConvertTo-Json -Depth 8 -Compress)
            if ($value.title -ne "Saeed 3D Character") { throw "Unexpected 3D page title: $($value.title)" }
            if (-not $value.frame -or -not $value.canvas -or -not $value.avatarApi) { throw "3D character surface is incomplete." }
            if ($value.status.overall.state -ne "ready") { throw "3D renderer overall state is not READY: $($value.status.overall.state)" }
            if ($value.status.components.threeJs.state -ne "ready") { throw "Three.js status is not READY." }
            if ($value.status.components.webgl.state -ne "ready") { throw "WebGL status is not READY." }
            if ($value.status.components.renderer.state -ne "ready") { throw "WebGLRenderer status is not READY." }
            if ($value.status.components.gltfLoader.state -ne "ready") { throw "GLTFLoader status is not READY." }
            if ($value.status.components.testObject.state -ne "rendered") { throw "Diagnostic 3D object was not rendered." }
            if ([int]$value.status.components.renderLoop.frames -lt 10) { throw "3D render loop did not produce enough frames." }
            if ([int]$value.status.metrics.drawCalls -lt 1) { throw "No WebGL draw calls were recorded." }
            Write-Host "3D_RENDER_SMOKE=PASS"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Get-Process | Where-Object { $_.Path -like "$PWD\\dist\\win-unpacked\\*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }



      - name: Generate Windows updater metadata
        shell: pwsh
        run: |
          $v=(Get-Content VERSION -Raw).Trim()+".0";$f=@(Get-ChildItem dist -Filter "*.exe"|?{$_.Name-notlike"*uninstaller*"})[0];if(!$f){throw "Installer missing"};$h=(Get-FileHash $f.FullName -Algorithm SHA512).Hash;$b=[Convert]::ToBase64String([Convert]::FromHexString($h));@{version=$v;files=@(@{url=$f.Name;sha512=$b;size=[int64]$f.Length});releaseDate=(Get-Date).ToUniversalTime().ToString("o")}|ConvertTo-Json -Depth 5|Set-Content dist/latest.yml -Encoding UTF8;Write-Host "UPDATE_METADATA_CHECK=PASS"

      - name: Verify release output
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content "VERSION" -Raw).Trim()
          if (-not (Test-Path "dist" -PathType Container)) { throw "dist directory was not created" }
          $installers = @(Get-ChildItem "dist" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*uninstaller*" })
          if ($installers.Count -ne 1) { throw "Expected exactly one installer EXE, found $($installers.Count)" }
          $installer = $installers[0]
          $expectedName = "Saeed.AI.Setup.$releaseVersion.0.exe"
          if ($installer.Name -ne $expectedName) { throw "Installer version mismatch: expected $expectedName, found $($installer.Name)" }
          if ($installer.Length -lt 10000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          $blockmaps = @(Get-ChildItem "dist" -Filter "*.blockmap" -File)
          if ($blockmaps.Count -lt 1) { throw "Installer blockmap is missing" }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$sha  $($installer.Name)" | Set-Content "dist/Saeed-AI-Setup-x64.exe.sha256"
          Write-Host "Verified installer: $($installer.Name)"
          Write-Host "Size: $($installer.Length) bytes"
          Write-Host "SHA256: $sha"

      - name: Upload verified build and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-AI-windows-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.sha256
            dist/latest.yml

      - name: Publish official release only when explicitly requested
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to create a duplicate."
            exit 1
          fi
          gh release create "$TAG" dist/*.exe dist/*.blockmap dist/*.sha256 dist/latest.yml \
            --title "Saeed AI ${VERSION}" \
            --notes "Official Windows Electron release. Commit: ${{ github.sha }}. Workflow Build: ${{ github.run_number }}." \
            --target "${{ github.sha }}"
