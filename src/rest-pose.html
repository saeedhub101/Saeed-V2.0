<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saeed Rest Pose Editor</title><link rel="stylesheet" href="rest-pose.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script></head><body><main class="editor"><header><div><div class="eyebrow">SAEED 3D</div><h1>Rest Pose Editor</h1><p>Move the character and adjust any bone until the normal pose is correct.</p></div><button id="save" class="primary">Save Normal Pose</button></header><section class="workspace"><div id="viewport"><canvas id="avatar"></canvas><div id="loading">Loading character…</div></div><aside><label>Bone<select id="bone"><option value="">Loading bones…</option></select></label><h2>Rotation (degrees)</h2><div class="axis"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>Z<input id="z" type="number" step="1"></label></div><h2>Local Position</h2><div class="axis"><label>X<input id="px" type="number" step="0.01"></label><label>Y<input id="py" type="number" step="0.01"></label><label>Z<input id="pz" type="number" step="0.01"></label></div><button id="apply" class="primary">Apply Bone</button><button id="normalize">Run normalizeHumanoidRestPose</button><button id="reset">Reset Pose</button><button id="resetView">Reset View</button><div id="state"></div><small>Drag the character with the mouse to rotate it. The saved pose is stored per character and becomes the rest/base pose on the next load.</small></aside></section></main><script type="module" src="avatar.js"></script><script src="rest-pose.js"></script></body></html>
