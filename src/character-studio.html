<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saeed Character Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px "Segoe UI",sans-serif;color:#17232d;background:#eef3f5;height:100vh;overflow:hidden}header{height:58px;background:#fff;border-bottom:1px solid #d5dfe2;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}h1{font-size:17px;margin:0}.sub{font-size:10px;color:#687980}.close{width:32px;height:32px;border:1px solid #ccd7da;background:#fff;border-radius:6px;font-size:20px}main{height:calc(100vh - 58px);display:grid;grid-template-columns:minmax(420px,1fr) 330px;grid-template-rows:1fr 205px}.viewer{position:relative;background:#17232d;min-height:0;border-right:1px solid #cbd7da}.viewer canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:10px;top:10px;background:#0008;color:#fff;padding:7px 9px;border-radius:6px;font-size:11px}.viewerbar{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center}.viewerbar button,.tabs button,.btn{border:1px solid #cbd7da;background:#fff;border-radius:6px;padding:7px 9px;cursor:pointer}.viewerbar button.active,.primary{background:#176f69;color:#fff;border-color:#176f69}.side{background:#fff;overflow:auto;padding:12px}.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button.active{background:#176f69;color:#fff}.panel{display:none}.panel.active{display:block}.field{display:grid;gap:4px;margin-bottom:9px;font-weight:700;color:#52636b}.field input,.field select{height:32px;border:1px solid #cbd7da;border-radius:5px;padding:0 7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.status{font-size:11px;color:#65757d;white-space:pre-wrap}.boneList{height:185px}.slot{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bottom{grid-column:1/3;background:#fff;border-top:1px solid #cbd7da;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;overflow:auto}.box{border:1px solid #d5dfe2;border-radius:7px;padding:9px}.box h3{margin:0 0 7px;font-size:12px}.rot button{width:34px}.small{font-size:10px;color:#738189}.ok{color:#176f69}.warn{color:#9a5a19}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}.bottom{grid-column:1;grid-template-columns:1fr}.side{position:absolute;right:0;top:58px;bottom:205px;width:320px;z-index:3;box-shadow:-5px 0 18px #0002}.viewer{border:0}}
</style></head>
<body><header><div><h1>Saeed Character Studio</h1><div class="sub">Live 3D character • bone selection • manual rig binding • Rest Pose • animation</div></div><button id="close" class="close">×</button></header>
<main>
<section class="viewer"><canvas id="studio3d"></canvas><div class="hint" id="hint">Waiting for character… Click a bone to select it.</div><div class="viewerbar"><button id="front">Front</button><button id="resetCam">Reset View</button><button id="showBones">Bones: ON</button><span class="small" id="viewerStatus"></span></div></section>
<aside class="side">
<nav class="tabs"><button class="active" data-tab="rig">Rig</button><button data-tab="pose">Pose</button><button data-tab="anim">Animation</button></nav>
<section id="rig" class="panel active"><label class="field">Bone<select id="boneList" class="boneList" size="8"></select></label><label class="field">Selected<input id="boneName" readonly></label><div class="slot"><label class="field">Rig Slot<select id="slot"></select></label><button id="bind" class="btn primary">Bind Selected</button></div><div class="grid"><label class="field">X°<input id="rx" type="number" step="1"></label><label class="field">Y°<input id="ry" type="number" step="1"></label><label class="field">Z°<input id="rz" type="number" step="1"></label></div><div class="actions"><button id="apply" class="btn primary">Apply Rotation</button><button id="resetBone" class="btn">Reset Bone</button></div><div class="status" id="rigStatus"></div></section>
<section id="pose" class="panel"><div class="actions"><button id="auto" class="btn primary">Auto Map Rig</button><button id="capture" class="btn">Save Current Rest</button><button id="normalize" class="btn">Normalize Rest</button><button id="resetRest" class="btn">Reset Rest</button></div><div class="status" id="poseStatus"></div><div class="status" id="mapping"></div></section>
<section id="anim" class="panel"><label class="field">Motion<select id="motion"></select></label><div class="grid"><label class="field">Speed<input id="speed" type="number" value="1" step=".1"></label><label class="field">Duration<input id="duration" type="number" value="1" step=".1"></label></div><div class="actions"><button id="play" class="btn primary">Play</button><button id="stop" class="btn">Stop</button></div><div class="actions"><button id="loadMotion" class="btn">Load Selected</button><button id="saveMotion" class="btn primary">Save / Update Motion</button><button id="deleteMotion" class="btn">Delete Motion</button></div><label class="field">Motion ID<input id="motionId" placeholder="myMotion"></label><label class="field">Layer<select id="motionLayer"><option>body</option><option>arms</option><option>legs</option><option>face</option><option>special</option></select></label><label class="field">Loop<select id="motionLoop"><option value="false">No</option><option value="true">Yes</option></select></label><label class="field">Keyframes JSON<textarea id="motionKeyframes" style="min-height:150px;width:100%;font:11px monospace;border:1px solid #cbd7da;border-radius:5px;padding:7px"></textarea></label><div class="status" id="animStatus"></div></section>
</aside>
<section class="bottom"><div class="box"><h3>Selected Bone</h3><div id="selectedInfo">None</div><div class="small">Click a bone in the 3D viewport or select it from Rig.</div></div><div class="box"><h3>Rig Mapping</h3><div id="mapInfo">Loading…</div></div><div class="box"><h3>Character</h3><div id="charInfo">Waiting…</div></div></section>
</main>
<script type="module">
import * as THREE from "./node_modules/three/build/three.module.js";
import {GLTFLoader} from "./three/GLTFLoader.js";
const $=id=>document.getElementById(id),cmd=p=>window.saeed.character.characterController(p);
const logical=["hips","spine","chest","neck","head","jaw","leftShoulder","rightShoulder","leftUpperArm","rightUpperArm","leftForeArm","rightForeArm","leftHand","rightHand","leftThigh","rightThigh","leftShin","rightShin","leftFoot","rightFoot","leftEye","rightEye"];
let scene,camera,renderer,root,model,bones=[],selected=null,showSkeleton=true,drag=false,last={x:0,y:0},yaw=0,pitch=.08,dist=3,markerGroup=null,markers=[];
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x17232d);camera=new THREE.PerspectiveCamera(35,1,.01,100);renderer=new THREE.WebGLRenderer({canvas:$("studio3d"),antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));scene.add(new THREE.HemisphereLight(0xffffff,0x33404a,2));const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(2,4,5);scene.add(l);root=new THREE.Group();scene.add(root);markerGroup=new THREE.Group();scene.add(markerGroup);resize();window.addEventListener("resize",resize);$("studio3d").addEventListener("pointerdown",down);window.addEventListener("pointermove",move);window.addEventListener("pointerup",()=>drag=false);$("studio3d").addEventListener("wheel",e=>{dist=Math.max(.5,Math.min(8,dist*(1+e.deltaY*.001)));camera.position.set(0,0,dist);look()},{passive:true});requestAnimationFrame(loop)}
function resize(){if(!renderer)return;const r=$("studio3d").getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();look()}
function look(){camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,0,0)}
function frame(){if(!model)return;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.set(-center.x,-center.y,-center.z);dist=Math.max(size.y*1.15,size.x*1.5,.8);look()}
function loop(){if(markers.length){for(const m of markers){const p=m.userData.bone.getWorldPosition(new THREE.Vector3());m.position.copy(p);m.scale.setScalar(m.userData.bone===selected?1.8:1);m.material.opacity=m.userData.bone===selected?1:.72}}renderer.render(scene,camera);requestAnimationFrame(loop)}
function down(e){drag=true;last={x:e.clientX,y:e.clientY};const r=$("studio3d").getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(markers,true);if(hits.length){select(hits[0].object.userData.bone.name)}}
function move(e){if(!drag)return;yaw-=(e.clientX-last.x)*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-last.y)*.006));last={x:e.clientX,y:e.clientY};look()}
function load(data){try{const bytes=data instanceof Uint8Array?data:new Uint8Array(data);new GLTFLoader().parse(bytes.buffer,"",(g)=>{root.clear();markerGroup.clear();markers=[];model=g.scene;root.add(model);bones=[];model.traverse(o=>{if(o.isBone)bones.push(o)});for(const b of bones){const m=new THREE.Mesh(new THREE.SphereGeometry(.018,8,8),new THREE.MeshBasicMaterial({color:0x53d6c6,transparent:true,opacity:.72}));m.userData.bone=b;markerGroup.add(m);markers.push(m)}frame();fillBones();$("hint").textContent="Character ready • click any bone to select it";$("viewerStatus").textContent=bones.length+" bones";$("charInfo").textContent="Loaded • "+bones.length+" bones";},e=>msg("rigStatus","GLB error: "+e.message,"warn"))}catch(e){msg("rigStatus",e.message,"warn")}}
function msg(id,t,k=""){const e=$(id);e.textContent=t;e.className="status "+k}
function select(name){selected=bones.find(b=>b.name===name)||null;if(!selected)return;$("boneName").value=selected.name;$("rx").value=Math.round(THREE.MathUtils.radToDeg(selected.rotation.x));$("ry").value=Math.round(THREE.MathUtils.radToDeg(selected.rotation.y));$("rz").value=Math.round(THREE.MathUtils.radToDeg(selected.rotation.z));$("selectedInfo").textContent=selected.name+" • parent: "+(selected.parent?.name||"root");const idx=[...$("boneList").options].find(o=>o.value===selected.name);if(idx)idx.selected=true}
function fillBones(){const s=$("boneList");s.innerHTML=bones.map(b=>"<option>"+b.name.replace(/</g,"&lt;")+"</option>").join("");if(bones[0])select(bones[0].name)}
function setRot(){if(!selected)return;const r={x:THREE.MathUtils.degToRad(Number($("rx").value)||0),y:THREE.MathUtils.degToRad(Number($("ry").value)||0),z:THREE.MathUtils.degToRad(Number($("rz").value)||0)};selected.rotation.set(r.x,r.y,r.z);cmd({action:"setBoneRotation",bone:selected.name,rotation:r}).then(x=>msg("rigStatus",x.ok?"Rotation applied live to main character.":x.error,x.ok?"ok":"warn"));frame()}
function fillSlots(){ $("slot").innerHTML=logical.map(x=>"<option value='"+x+"'>"+x+"</option>").join("")}
async function refresh(){const r=await cmd({action:"status"});const s=r.status||r;$("mapInfo").textContent=JSON.stringify(s.autoRig||{},null,2);$("mapping").textContent="Mapped slots: "+Object.keys(s.autoRig||{}).length;$("motion").innerHTML=(s.motions||[]).map(m=>"<option value='"+m.id+"'>"+m.id+"</option>").join("");}
$("boneList").onchange=()=>select($("boneList").value);$("apply").onclick=setRot;$("resetBone").onclick=()=>{if(selected){selected.rotation.set(0,0,0);setRot()}};$("bind").onclick=async()=>{if(!selected)return;const r=await cmd({action:"bindSlot",slot:$("slot").value,bone:selected.name});msg("rigStatus",r.ok?"Bound "+selected.name+" → "+$("slot").value:"Binding failed",r.ok?"ok":"warn");refresh()};$("auto").onclick=async()=>{const r=await cmd({action:"autoMap"});msg("poseStatus",JSON.stringify(r.mapping||r),r.ok?"ok":"warn");refresh()};$("capture").onclick=async()=>{const r=await cmd({action:"saveRestPose"});msg("poseStatus","Current pose saved as authoritative Rest Pose.","ok");refresh()};$("normalize").onclick=async()=>{const r=await cmd({action:"normalizeRestPose"});msg("poseStatus",JSON.stringify(r),"ok");refresh()};$("resetRest").onclick=async()=>{await cmd({action:"resetPose"});refresh()};$("play").onclick=async()=>{const r=await cmd({action:"play",motion:$("motion").value,options:{speed:Number($("speed").value)||1,duration:Number($("duration").value)||1}});msg("animStatus",r.ok?"Playing on main character":"Motion unavailable",r.ok?"ok":"warn")};$("stop").onclick=()=>cmd({action:"stopAll"});$("loadMotion").onclick=async()=>{const r=await cmd({action:"listMotions"});const m=(r.motions||[]).find(x=>x.id===$("motion").value);if(!m){msg("animStatus","Selected motion is not editable.","warn");return}$("motionId").value=m.id;$("duration").value=m.duration||1;$("motionLayer").value=m.layer||"body";$("motionLoop").value=String(!!m.loop);$("motionKeyframes").value=JSON.stringify(m.keyframes||[],null,2);msg("animStatus","Loaded "+m.id+" for editing.","ok")};$("saveMotion").onclick=async()=>{try{const id=$("motionId").value.trim();if(!id)throw new Error("Motion ID is required");const keyframes=JSON.parse($("motionKeyframes").value||"[]");const r=await cmd({action:"defineMotion",motion:{id,duration:Number($("duration").value)||1,layer:$("motionLayer").value,loop:$("motionLoop").value==="true",keyframes}});msg("animStatus",r.ok?"Motion saved to character profile.":r.error||"Motion save failed",r.ok?"ok":"warn");await refresh()}catch(e){msg("animStatus","Invalid keyframes JSON: "+e.message,"warn")}};$("deleteMotion").onclick=async()=>{const id=$("motionId").value.trim()||$("motion").value;if(!id)return;const r=await cmd({action:"deleteMotion",id});msg("animStatus",r.ok?"Motion deleted.":r.error||"Delete failed",r.ok?"ok":"warn");await refresh()};$("front").onclick=()=>{yaw=0;pitch=.08;look()};$("resetCam").onclick=()=>{yaw=0;pitch=.08;frame()};$("showBones").onclick=()=>{showSkeleton=!showSkeleton;markerGroup.visible=showSkeleton;$("showBones").textContent="Bones: "+(showSkeleton?"ON":"OFF");};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active")});
window.saeed.character.onCharacterSelected?.((data)=>load(data));$("close").onclick=()=>window.close();init();fillSlots();refresh();
</script></body></html>
