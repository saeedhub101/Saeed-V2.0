<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saeed Character Studio</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#17232d;background:#eef3f5}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d5dfe2;display:flex;justify-content:space-between;align-items:center}h1{margin:4px 0;font-size:22px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;color:#39766f}.muted{color:#64747c;font-size:12px}.close{font-size:22px;border:1px solid #d5dfe2;background:#fff;border-radius:7px;width:38px;height:38px}main{padding:18px 22px;max-width:1100px;margin:auto}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{padding:9px 13px;border:1px solid #d5dfe2;background:#fff;border-radius:7px;cursor:pointer}.tabs button.active{background:#176f69;color:#fff}.panel{display:none;background:#fff;border:1px solid #d5dfe2;border-radius:9px;padding:18px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;font-size:11px;font-weight:700;color:#52636b}.field input,.field select{height:38px;border:1px solid #cbd7da;border-radius:6px;padding:0 9px}.bones{width:100%;height:260px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{padding:9px 13px;border-radius:7px;border:1px solid #d5dfe2;font-weight:700;cursor:pointer}.primary{background:#176f69;color:#fff;border-color:#176f69}.status{margin-top:12px;font-size:12px;color:#5b6b73;white-space:pre-wrap}.warn{color:#9a5a19}.ok{color:#176f69}.check{display:flex;gap:8px;align-items:center;font-size:12px;padding:7px 0}.cap{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.cap span{padding:8px;border-radius:6px;background:#eef3f5;font-size:11px}.cap .yes{background:#dff1ed;color:#176f69}.motionList{max-height:230px;overflow:auto}.motion{padding:8px;border-bottom:1px solid #e8edef;display:flex;justify-content:space-between}.small{font-size:10px;color:#738189}@media(max-width:760px){.grid,.grid2,.cap{grid-template-columns:1fr}.bones{height:210px}}
</style></head>
<body><header><div><span class="eyebrow">CHARACTER ENGINE</span><h1>Saeed Character Studio</h1><div class="muted">Character, bones, rig, Rest Pose, retargeting, animation and autonomous behavior — one workspace.</div></div><button id="close" class="close">×</button></header>
<main><nav class="tabs"><button class="active" data-tab="overview">Character</button><button data-tab="rig">Rig & Bones</button><button data-tab="rest">Rest Pose</button><button data-tab="animation">Animation</button><button data-tab="behavior">Behavior</button></nav>
<section id="overview" class="panel active"><b id="state">Loading…</b><div id="caps" class="cap"></div><div class="actions"><button id="refresh" class="secondary">Refresh Character</button><button id="auto" class="primary">Auto Map Rig</button><button id="reset" class="secondary">Reset Pose</button></div><p id="overviewStatus" class="status"></p></section>
<section id="rig" class="panel"><div class="grid2"><div><div class="field">Available bones<select id="boneList" class="bones"></select></div></div><div><div class="field">Selected bone<input id="boneName" readonly></div><div class="grid"><label class="field">X (deg)<input id="bx" type="number" step="1"></label><label class="field">Y (deg)<input id="by" type="number" step="1"></label><label class="field">Z (deg)<input id="bz" type="number" step="1"></label></div><div class="actions"><button id="applyBone" class="primary">Apply Bone</button><button id="saveRest" class="secondary">Save Current as Rest Pose</button></div><p id="boneStatus" class="status"></p></div></div></section>
<section id="rest" class="panel"><p class="muted">Rest Pose is authoritative. Animation and retargeting are calculated relative to this saved state.</p><div class="actions"><button id="normalize" class="primary">Normalize Humanoid Rest Pose</button><button id="capture" class="secondary">Capture Current Rest Pose</button><button id="resetRest" class="secondary">Reset to Rest Pose</button></div><p id="restStatus" class="status"></p></section>
<section id="animation" class="panel"><div class="grid"><label class="field">Motion<select id="motion"></select></label><label class="field">Duration<input id="duration" type="number" value="1" min=".1" step=".1"></label><label class="field">Speed<input id="speed" type="number" value="1" min=".1" step=".1"></label></div><div class="actions"><button id="play" class="primary">Play</button><button id="stop" class="secondary">Stop All</button></div><p id="animationStatus" class="status"></p></section>
<section id="behavior" class="panel"><div class="grid"><label class="check"><input id="idle" type="checkbox" checked>Idle motions</label><label class="check"><input id="blinking" type="checkbox" checked>Automatic blinking</label><label class="check"><input id="expressions" type="checkbox" checked>Expressions</label><label class="check"><input id="speechFace" type="checkbox" checked>Face during speech</label><label class="check"><input id="eyeTracking" type="checkbox" checked>Eye tracking</label><label class="check"><input id="autonomousMovement" type="checkbox" checked>Autonomous movement</label></div><div class="grid"><label class="field">Idle frequency (ms)<input id="frequency" type="number" value="7000" min="1000"></label><label class="field">Event cooldown (ms)<input id="cooldown" type="number" value="2500" min="0"></label><label class="field">Sleep after (min)<input id="sleep" type="number" value="20" min="1"></label></div><div class="actions"><button id="saveBehavior" class="primary">Apply Behavior Settings</button></div><p id="behaviorStatus" class="status"></p></section></main>
<script>
const $=id=>document.getElementById(id);const cmd=p=>window.saeed.character.characterController(p);
let statusData=null,bones={};
function deg(v){return Number(v||0)*Math.PI/180}function rad(v){return Number(v||0)*180/Math.PI}
function msg(id,t,kind=""){const e=$(id);e.textContent=t;e.className="status "+kind}
function fillCaps(c){$("caps").innerHTML=Object.entries(c||{}).map(([k,v])=>'<span class="'+(v?"yes":"")+'">'+k+': '+(v?"yes":"no")+"</span>").join("")}
function fillBones(){const s=$("boneList");s.innerHTML=Object.keys(bones).map(n=>'<option value="'+n.replace(/"/g,"&quot;")+'">'+n+"</option>").join("");if(s.options.length)selectBone(s.value)}
function selectBone(n){const b=bones[n];if(!b)return;$("boneName").value=n;$("bx").value=rad(b.rotation?.x);$("by").value=rad(b.rotation?.y);$("bz").value=rad(b.rotation?.z)}
async function refresh(){try{statusData=await cmd({action:"status"});const s=statusData?.status||statusData;const pose=s?.actualBones||{};bones=pose;const loaded=Boolean(s?.characterLoaded??s?.loaded);$("state").textContent=loaded?"Character loaded":"No character loaded";fillCaps(s?.capabilities||{});$("overviewStatus").textContent=loaded?"Bones: "+Object.keys(bones).length+" • Rest: "+JSON.stringify(s?.restPose||{}) :"Load a GLB character first.";fillBones();const motions=s?.motions||[];$("motion").innerHTML=motions.map(m=>'<option value="'+m.id+'">'+m.id+"</option>").join("");}catch(e){msg("overviewStatus",e.message,"warn")}}
$("boneList").onchange=()=>selectBone($("boneList").value);$("refresh").onclick=refresh;$("close").onclick=()=>window.close();$("auto").onclick=async()=>{const r=await cmd({action:"autoMap"});msg("overviewStatus",JSON.stringify(r),"ok");refresh()};$("reset").onclick=async()=>{await cmd({action:"resetPose"});refresh()};
$("applyBone").onclick=async()=>{const r=await cmd({action:"setBoneRotation",bone:$("boneName").value,rotation:{x:deg($("bx").value),y:deg($("by").value),z:deg($("bz").value)}});msg("boneStatus",r?.ok===false?(r.error||"Failed"):"Applied","ok");refresh()};
$("saveRest").onclick=async()=>{const r=await cmd({action:"saveRestPose"});msg("boneStatus",JSON.stringify(r),"ok");refresh()};
$("normalize").onclick=async()=>{const r=await cmd({action:"normalizeRestPose"});msg("restStatus",JSON.stringify(r),r?.normalized?"ok":"warn");refresh()};
$("capture").onclick=async()=>{const r=await cmd({action:"saveRestPose"});msg("restStatus","Current pose is now the authoritative Rest Pose.","ok");refresh()};
$("resetRest").onclick=async()=>{await cmd({action:"resetPose"});msg("restStatus","Rest Pose restored.","ok");refresh()};
$("play").onclick=async()=>{const r=await cmd({action:"play",id:$("motion").value,options:{duration:Number($("duration").value)||1,speed:Number($("speed").value)||1}});msg("animationStatus",r?"Motion started":"Motion unavailable","ok")};$("stop").onclick=()=>cmd({action:"stopAll"});
$("saveBehavior").onclick=async()=>{const r=await cmd({action:"setBehavior",value:{idle:$("idle").checked,blinking:$("blinking").checked,expressions:$("expressions").checked,speechFace:$("speechFace").checked,eyeTracking:$("eyeTracking").checked,autonomousMovement:$("autonomousMovement").checked,frequencyMs:Number($("frequency").value)||7000,eventCooldownMs:Number($("cooldown").value)||2500,sleepAfterMs:Math.max(1,Number($("sleep").value)||20)*60000}});msg("behaviorStatus","Behavior settings applied as the single runtime configuration.","ok");};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active")});refresh();
</script></body></html>
