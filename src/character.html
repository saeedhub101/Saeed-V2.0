<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Saeed 3D Character</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script></head><body class="characterWindow"><div id="character" title="Drag Saeed to move"><canvas id="avatar"></canvas><div class="shadow"></div><div id="micBadge" class="micBadge off">●</div></div><div id="status" class="characterStatus">Saeed 3D</div><script type="module" src="avatar.js"></script><script>\nconst character=document.getElementById("character");let dragging=false,lastX=0,lastY=0;\ncharacter.addEventListener("mousedown",e=>{if(e.button!==0)return;dragging=true;lastX=e.screenX;lastY=e.screenY;e.preventDefault()});\nwindow.addEventListener("mousemove",e=>{if(!dragging)return;const dx=e.screenX-lastX,dy=e.screenY-lastY;lastX=e.screenX;lastY=e.screenY;window.saeed.moveWindowBy(dx,dy)});\nwindow.addEventListener("mouseup",()=>{dragging=false});\ncharacter.addEventListener("dblclick",()=>window.saeed.showChat());\nwindow.saeed.onCharacterSelected(data=>window.saeedAvatarLoadData?.(data));\n</script></body></html>
