<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Saeed 3D Character</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script></head><body class="characterWindow"><div id="characterFrame"><div class="frameTitle">3D Render Diagnostics <span>• Standalone Test Object</span></div><div id="character" title="Drag 3D window to move"><canvas id="avatar"></canvas><div id="status" class="characterStatus">Initializing 3D renderer…</div></div></div><script type="module" src="avatar.js"></script><script>
const character=document.getElementById("character");let dragging=false,lastX=0,lastY=0;character.addEventListener("mousedown",e=>{if(e.button!==0)return;dragging=true;lastX=e.screenX;lastY=e.screenY;e.preventDefault()});window.addEventListener("mousemove",e=>{if(!dragging)return;const dx=e.screenX-lastX,dy=e.screenY-lastY;lastX=e.screenX;lastY=e.screenY;window.saeed.moveWindowBy(dx,dy)});window.addEventListener("mouseup",()=>{dragging=false});character.addEventListener("dblclick",()=>window.saeed.showChat());window.saeed.onCharacterSelected(data=>window.saeedAvatarLoadData?.(data));window.saeed.on3DQuery(id=>window.saeed.report3DStatus(id,window.saeedAvatar?.get3DStatus?.()||{overall:{state:"error",detail:"3D renderer API not ready"},components:{},lastUpdated:new Date().toISOString()}));window.saeed.on3DReload(()=>window.saeedAvatar?.reloadDiagnostic?.());
</script></body></html>
