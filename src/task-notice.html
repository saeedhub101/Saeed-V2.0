<!doctype html><html><head><meta charset="utf-8"><title>Saeed</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:rgba(20,22,28,.97);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;overflow:hidden}.wrap{padding:18px}.title{font-size:17px;font-weight:700;margin-bottom:8px}.text{font-size:14px;line-height:1.5;color:#e8eaf0;white-space:pre-wrap;max-height:180px;overflow:auto}.buttons{display:flex;gap:10px;margin-top:16px}.buttons button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:700;cursor:pointer}.ok{background:#fff;color:#111}.no{background:#333740;color:#fff}.muted{font-size:11px;color:#9da3b0;margin-top:9px}</style></head><body><div class="wrap"><div id="title" class="title">Saeed</div><div id="text" class="text"></div><div id="buttons" class="buttons"></div><div id="muted" class="muted">You can continue using Saeed without opening Chat.</div></div><script>const q=new URLSearchParams(location.search),id=q.get("id")||"";let done=false;function finish(ok){if(done)return;done=true;window.saeed.respondTaskNotice(id,Boolean(ok))}window.saeed.onTaskNotice(e=>{if(String(e.id)!==id)return;document.getElementById("title").textContent=e.title||"Saeed";document.getElementById("text").textContent=e.message||"";const b=document.getElementById("buttons");b.innerHTML="";if(e.kind==="progress"){b.style.display="none";return}b.style.display="flex";for(const a of (e.actions||[{label:"Accept",value:true,primary:true},{label:"Reject",value:false}])){const x=document.createElement("button");x.textContent=a.label;x.className=a.primary?"ok":"no";x.onclick=()=>finish(a.value===true||a.value==="accept") ;b.appendChild(x)}});window.addEventListener("load",()=>window.saeed.taskNoticeReady(id));</script></body></html>
