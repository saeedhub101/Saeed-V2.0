<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Saeed Learning</title><link rel="stylesheet" href="window.css"></head><body><main><header><div><div class="eyebrow">SAEED AI</div><h1>Learning / Teach Mode</h1><p>Describe a new task in plain language and let Saeed inspect the screen, choose tools, act, and verify the result. Recording is optional for repeatable workflows.</p></div><button id="openFeatures">All Features</button><button id="refresh">Refresh</button><button id="import">Import</button><button id="export">Export selected</button></header><section class="form"><h2>Ask Saeed to do a task</h2><textarea id="taskPrompt" rows="3" placeholder="Describe what you want Saeed to do, e.g. open the employee form, find the name and age fields, fill them in, and verify the result."></textarea><div class="row"><button id="runTask">Understand &amp; execute</button></div><div id="taskResult" class="meta" aria-live="polite"></div></section><section class="form"><h2>Save a repeatable skill (optional)</h2><input id="name" placeholder="Skill name"><input id="phrases" placeholder="Trigger phrases, separated by |"><textarea id="steps" placeholder='Optional steps JSON, e.g. [{"tool":"open_url","args":{"url":"https://mail.google.com"}}]'></textarea><div class="row"><button id="record">Start recording</button><button id="save">Save Skill</button><button id="clear" class="secondary">Clear</button></div><div id="recording" class="meta"></div><div id="message"></div></section><section id="list"></section><input id="file" type="file" accept=".json" hidden></main><script src="window.js"></script></body></html>
